    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(journalRows.length?journalRows:[{Date:''}]), 'Journal');

  yearsAvailable().slice().sort((a,b)=>a-b).forEach(year=>{
    const r = resultForYear(year);
    const resRows = [];
    resRows.push({Classe:"Classe 7", "N° compte":"", Libellé:"PRODUITS D'EXPLOITATION", "Montant (€)":""});
    sortCompteEntries(Object.entries(r.prodByCompte)).forEach(([c,v])=>resRows.push({Classe:'', 'N° compte':c, Libellé:libelleForCompte(c), 'Montant (€)':v}));
    resRows.push({Classe:'', 'N° compte':'', Libellé:'Total Classe 7 — Produits', 'Montant (€)':r.produits});
    resRows.push({Classe:"Classe 6", "N° compte":"", Libellé:"CHARGES D'EXPLOITATION", "Montant (€)":""});
    sortCompteEntries(Object.entries(r.chgByCompte)).forEach(([c,v])=>resRows.push({Classe:'', 'N° compte':c, Libellé:libelleForCompte(c), 'Montant (€)':v}));
    resRows.push({Classe:'', 'N° compte':'', Libellé:'Total Classe 6 — Charges', 'Montant (€)':r.charges});
    resRows.push({Classe:'', 'N° compte':'12', Libellé:"RÉSULTAT DE L'EXERCICE", 'Montant (€)':r.resultat});
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resRows), ('Resultat '+exerciceLabel(year)).slice(0,31));

    const cutoff = cutoffForYear(year);
    const tresoBanque=treasuryAt(cutoff,'5121'), tresoLivretA=treasuryAt(cutoff,'5122'), tresoCaisse=treasuryAt(cutoff,'530'), immo=immoAt(cutoff);
    const tiersEntriesX = tiersDetailAt(cutoff).filter(e=>Math.abs(e.montant)>=0.005)
      .sort((a,b)=> a.compte.localeCompare(b.compte, undefined, {numeric:true}) || a.nom.localeCompare(b.nom));
    const tiersActifX = tiersEntriesX.filter(e=>e.montant>0), tiersPassifX = tiersEntriesX.filter(e=>e.montant<0);
    const totTA = tiersActifX.reduce((a,e)=>a+e.montant,0), totTP = tiersPassifX.reduce((a,e)=>a-e.montant,0);
    const fondsInitiaux=soldeOuvertureFor('110');
    const reportAnterieur = fondsInitiaux+resultBeforeYear(year);
    const bilanRows = [
      {Rubrique:'ACTIF', 'N° compte':'', Libellé:'', 'Montant (€)':''},
      {Rubrique:'', 'N° compte':COMPTE_IMMO.compte, Libellé:COMPTE_IMMO.libelle, 'Montant (€)':immo},
      ...tiersActifX.map(e=>({Rubrique:'', 'N° compte':e.compte, Libellé:e.nom, 'Montant (€)':e.montant})),
      {Rubrique:'', 'N° compte':COMPTE_BANQUE.compte, Libellé:COMPTE_BANQUE.libelle, 'Montant (€)':tresoBanque},
      {Rubrique:'', 'N° compte':COMPTE_LIVRETA.compte, Libellé:COMPTE_LIVRETA.libelle, 'Montant (€)':tresoLivretA},
      {Rubrique:'', 'N° compte':COMPTE_CAISSE.compte, Libellé:COMPTE_CAISSE.libelle, 'Montant (€)':tresoCaisse},
      {Rubrique:'', 'N° compte':'', Libellé:'TOTAL ACTIF', 'Montant (€)':tresoBanque+tresoLivretA+tresoCaisse+immo+totTA},
      {Rubrique:'PASSIF', 'N° compte':'', Libellé:'', 'Montant (€)':''},
      {Rubrique:'', 'N° compte':COMPTE_FONDS.compte, Libellé:COMPTE_FONDS.libelle, 'Montant (€)':reportAnterieur},
      {Rubrique:'', 'N° compte':COMPTE_RESULTAT.compte, Libellé:COMPTE_RESULTAT.libelle, 'Montant (€)':r.resultat},
      ...tiersPassifX.map(e=>({Rubrique:'', 'N° compte':e.compte, Libellé:e.nom, 'Montant (€)':-e.montant})),
      {Rubrique:'', 'N° compte':'', Libellé:'TOTAL PASSIF', 'Montant (€)':reportAnterieur+r.resultat+totTP},
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bilanRows), ('Bilan '+exerciceLabel(year)).slice(0,31));
  });

  const stockItems = data.transactions.filter(t=>t.type==='depense'&&t.immo).map(t=>{
    const ageYears = (new Date()-new Date(t.date+'T00:00:00'))/(365.25*86400000);
    return {
      Désignation: t.designation || t.comment || 'Matériel', "Date d'achat": t.date, 'Valeur (€)': t.amount,
      'Âge (années)': Math.round(ageYears*10)/10, 'Durée de vie estimée (années)': t.dureeVie || 5
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stockItems.length?stockItems:[{Désignation:''}]), 'Stock');

  const joueursRows = data.players.map(p=>({
    Prénom: p.prenom, Nom: p.nom, 'Date de naissance': p.birthDate || '',
    "Âge": ageFromBirth(p.birthDate), Catégorie: bucketFor(ageFromBirth(p.birthDate))||"", Genre: p.gender || "",
    "Équipes": (p.teamIds||[]).map(tid=>{const t=data.teams.find(t=>t.id===tid);return t?t.nom:'';}).filter(Boolean).join(', '),
    'Nb licences': p.licenses.length,
    'Dernière licence': p.licenses.length ? [...p.licenses].sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0].date : ''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(joueursRows.length?joueursRows:[{Prénom:''}]), 'Joueurs');

  const tripRows = [];
  data.trips.forEach(t=>{
    const c = tripCalc(t);
    t.participants.forEach(p=>{
      tripRows.push({
        Déplacement: t.nom, Date: t.date, Participant: participantName(p), Rôle: p.role,
        'Montant dû (€)': Math.round((c.montants[p.id]||0)*100)/100, 'Virement reçu': p.paiementRecu?'Oui':'Non'
      });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tripRows.length?tripRows:[{Déplacement:''}]), 'Deplacements');

  /* Feuilles complémentaires lisibles + sauvegarde technique (permet de réimporter ce fichier comme le JSON) */
  const evRows = (data.events||[]).map(e=>({ Nom:e.nom, Date:e.date }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(evRows.length?evRows:[{Nom:''}]), 'Evenements');
  const teamRows = (data.teams||[]).map(t=>({ Nom:t.nom, Type:t.type }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(teamRows.length?teamRows:[{Nom:''}]), 'Equipes');
  const planRows = (data.accounts||[]).map(a=>({ 'N° compte':a.compte, Libellé:a.libelle }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(planRows.length?planRows:[{'N° compte':''}]), 'Plan comptable');
  const relRows = [];
  (data.releves||[]).forEach(r=>(r.lines||[]).forEach(l=>relRows.push({ Mois:r.mois||'', Relevé:r.name, Date:l.date, Libellé:l.label, 'Montant (€)':l.amount, 'Rapprochée':l.confirmed?'Oui':'Non' })));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(relRows.length?relRows:[{Mois:''}]), 'Releves banque');
  const st = data.settings||{};
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ Club:st.clubName||'', 'Solde initial':st.soldeInitial||0, 'Immobilisations initiales':st.immoInitial||0 }]), 'Reglages');
  const fullJson = JSON.stringify(data);
  const techRows = [["Sauvegarde technique de l'application — ne pas modifier ni supprimer (utilisée pour réimporter ce fichier)"]];
  for(let i=0;i<fullJson.length;i+=30000) techRows.push([fullJson.slice(i,i+30000)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(techRows), '_Sauvegarde');
  wb.Workbook = { Sheets: wb.SheetNames.map(n=>({ Hidden: n==='_Sauvegarde' ? 1 : 0 })) };
  XLSX.writeFile(wb, 'comptes-club-'+todayStr()+'.xlsx');
  showToast('Export Excel généré ✓');
}

async function fileToOcrImages(file, maxPages){
  if(file.type !== 'application/pdf') return [file];
  if(typeof pdfjsLib === 'undefined') throw new Error('Lecteur PDF non chargé (connexion internet nécessaire)');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const n = Math.min(pdf.numPages, maxPages||8);
  const images = [];
  for(let i=1;i<=n;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 2 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const blob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
    if(blob) images.push(blob);
  }
  return images;
}

async function handleScanJustificatif(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const statusEl = document.getElementById('f-scan-status');
  const btnEl = document.getElementById('f-scan-btn');
  if(!statusEl || !btnEl) return;
  if(typeof Tesseract === 'undefined'){
    statusEl.style.display = 'block';
    statusEl.textContent = "La lecture automatique n'a pas pu se charger (connexion internet nécessaire la première fois).";
    return;
  }
  btnEl.disabled = true;
  statusEl.style.display = 'block';
  statusEl.textContent = 'Lecture du justificatif en cours… (quelques secondes)';
  try{
    const images = await fileToOcrImages(file, 3);
    let text = '';
    for(let i=0;i<images.length;i++){
      const result = await Tesseract.recognize(images[i], 'fra', {
        logger: m=>{
          if(m.status==='recognizing text' && statusEl){
            statusEl.textContent = 'Lecture en cours… '+Math.round((m.progress||0)*100)+'%'+(images.length>1?` (page ${i+1}/${images.length})`:'');
          }
        }
      });
      text += '\n' + ((result && result.data && result.data.text) || '');
    }
    const parsed = parseReceiptText_(text);
    let found = [];
    if(parsed.amount!=null){
      const amountEl = document.getElementById('f-amount');
      if(amountEl){ amountEl.value = parsed.amount; found.push('montant: '+parsed.amount+' €'); }
    }
    if(parsed.date){
      const dateEl = document.getElementById('f-date');
      if(dateEl){ dateEl.value = parsed.date; found.push('date: '+parsed.date); }
    }
    statusEl.textContent = (found.length ? ('Détecté — '+found.join(', ')+'. Vérifiez avant d\'enregistrer.') : "Aucun montant/date détecté avec certitude — vérifiez ou saisissez manuellement.") + ' Envoi du justificatif sur Drive…';
    try{
      const folderId = await findOrCreateDriveSubfolder('Justificatifs');
      const uploaded = await driveUploadFile(file, folderId, `${todayStr()}_${file.name}`);
      pendingPieceJointe = { id: uploaded.id, name: uploaded.name, link: driveFileViewLink(uploaded.id) };
      renderPieceJointeStatus_(found);
    }catch(upErr){
      console.error('Erreur upload Drive', upErr);
      statusEl.innerHTML = (found.length ? ('Détecté — '+found.join(', ')+'. Vérifiez avant d\'enregistrer.<br>') : '') + '⚠️ Le justificatif n\'a pas pu être envoyé sur Drive (données du formulaire conservées).';
    }
  }catch(e){
    console.error('Erreur OCR', e);
    statusEl.textContent = 'Erreur pendant la lecture du justificatif — saisissez manuellement.';
  }finally{
    btnEl.disabled = false;
  }
}

function parseReceiptText_(text){
  const result = { amount: null, date: null };
  if(!text) return result;
  const clean = text.replace(/\u00a0/g,' ');

  // --- Montant : on cherche en priorité un nombre proche des mots "total"/"montant"/"net à payer" ---
  const lines = clean.split(/\r?\n/);
  const amountRe = /(\d{1,4}[.,]\d{2})\s*€?/g;
  let bestAmount = null;
  let bestScore = -1;
  for(const line of lines){
    const lower = line.toLowerCase();
    let score = 0;
    if(/total|net à payer|net a payer|montant|à payer|a payer/.test(lower)) score += 3;
    if(/ttc/.test(lower)) score += 1;
    if(/sous[-\s]?total|dont tva|tva\s*:/.test(lower)) score -= 2;
    let m;
    amountRe.lastIndex = 0;
    while((m = amountRe.exec(line))){
      const val = parseFloat(m[1].replace(',', '.'));
      if(isNaN(val) || val<=0 || val>99999) continue;
      if(score > bestScore || (score===bestScore && (bestAmount===null || val>bestAmount))){
        bestScore = score; bestAmount = val;
      }
    }
  }
  if(bestAmount===null){
    // repli : le plus grand montant trouvé dans tout le texte
    let m, max=null;
    amountRe.lastIndex = 0;
    while((m = amountRe.exec(clean))){
      const val = parseFloat(m[1].replace(',', '.'));
      if(!isNaN(val) && val>0 && val<99999 && (max===null || val>max)) max = val;
    }
    bestAmount = max;
  }
  if(bestAmount!==null) result.amount = Math.round(bestAmount*100)/100;

  // --- Date : jj/mm/aaaa, jj-mm-aaaa, ou "12 janvier 2026" ---
  const moisMap = {janvier:1,février:2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,aout:8,septembre:9,octobre:10,novembre:11,décembre:12,decembre:12};
  let dateMatch = clean.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(dateMatch){
    let [,d,mo,y] = dateMatch;
    if(y.length===2) y = (parseInt(y)<70?'20':'19')+y;
    d=d.padStart(2,'0'); mo=mo.padStart(2,'0');
    if(parseInt(mo)>=1 && parseInt(mo)<=12 && parseInt(d)>=1 && parseInt(d)<=31){
      result.date = `${y}-${mo}-${d}`;
    }
  }
  if(!result.date){
    const litRe = /(\d{1,2})\s+(janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)\s+(\d{4})/i;
    const lm = clean.match(litRe);
    if(lm){
      const d = lm[1].padStart(2,'0');
      const mo = String(moisMap[lm[2].toLowerCase()]).padStart(2,'0');
      result.date = `${lm[3]}-${mo}-${d}`;
    }
  }
  return result;
}

    // montant, le commentaire et le compte de trésorerie sont modifiables ici — le lien avec
    // l'écriture d'origine et le compte de tiers ne doivent jamais être touchés depuis ce formulaire.

  const cat = CATEGORIES[ui.formCat];
  const amount = amountEarly;
  const date = dateEarly;
  const comment = document.getElementById('f-comment').value.trim();
  const compteSel = document.getElementById('f-compte').value;
  const immoBox = document.getElementById('f-immo');
  const designationEl = document.getElementById('f-designation');
  const dureeEl = document.getElementById('f-duree');
  const regleSel = document.getElementById('f-regle').value;
  const tresoSel = document.getElementById('f-treso').value;
  const tiersPlayerId = document.getElementById('f-tiers-player').value || undefined;
  const tiersNomInput = document.getElementById('f-tiers-nom').value.trim();
  const compteTiersSel = document.getElementById('f-tiers-compte').value;

  const immoVal = immoBox ? immoBox.checked : false;
  const designation = (immoVal && designationEl) ? designationEl.value.trim() : undefined;
  const dureeVie = (immoVal && dureeEl) ? (parseInt(dureeEl.value)||5) : undefined;
  const compteOverride = compteSel!==compteFor(ui.formCat) ? compteSel : undefined;
  const regleVal = regleSel==='oui';
  const tiersType = cat.type==='depense' ? 'fournisseur' : 'client';
  const tiersNom = tiersPlayerId ? playerNameFor(tiersPlayerId) : tiersNomInput;

  if(ui.editId){
    const t = data.transactions.find(t=>t.id===ui.editId);
    t.amount=amount; t.date=date; t.comment=comment; t.immo=immoVal; t.tresoCompte=tresoSel;

    if(!regleVal){ t.tiersType=tiersType; t.tiersNom=tiersNom||'Non précisé'; t.tiersPlayerId=tiersPlayerId; t.compteTiers=compteTiersSel; if(t.dateReglement===undefined) t.dateReglement=null; }

    if(pendingPieceJointe){ t.pieceJointeId=pendingPieceJointe.id; t.pieceJointeNom=pendingPieceJointe.name; }
    else { delete t.pieceJointeId; delete t.pieceJointeNom; }
  } else {
    const tx = { id: uid('tx'), type: cat.type, category: ui.formCat, amount, date, comment, immo: immoVal, regle: regleVal, tresoCompte: tresoSel };
    if(compteOverride) tx.compteOverride=compteOverride;
    if(immoVal){ tx.designation=designation; tx.dureeVie=dureeVie; }
    if(!regleVal){ tx.tiersType=tiersType; tx.tiersNom=tiersNom||'Non précisé'; tx.tiersPlayerId=tiersPlayerId; tx.compteTiers=compteTiersSel; tx.dateReglement=null; }
    if(ui.formEventId) tx.eventId = ui.formEventId;
    if(!tx.eventId){
      const linked = findOrCreateLinkedEvent_(accountForTx(tx), tx.date);
      if(linked){ tx.eventId = linked.ev.id; showToast(`Rattachée à l'événement « ${linked.ev.nom} »${linked.created?' (créé)':''}`); }
    }
    if(pendingPieceJointe){ tx.pieceJointeId=pendingPieceJointe.id; tx.pieceJointeNom=pendingPieceJointe.name; }
    data.transactions.push(tx);
    if(ui.prefillTx && ui.prefillTx.releveRef){
      const ref = ui.prefillTx.releveRef, rel = getReleve_(ref.relId), l = rel && rel.lines[ref.idx];
      if(l){ tx.pointe = true; tx.dateLettrage = l.date; tx.releveId = rel.id; l.confirmed = true; l.txIds = [tx.id]; }
    }
  }
  pendingPieceJointe = null;
  await saveData();
  closeForm();
  showToast('Opération enregistrée ✓');
  renderAll();
}
async function deleteTx(id){
  const t = data.transactions.find(x=>x.id===id);
  if(t && t.reglementTxId){
    // supprime aussi l'écriture de contrepassation associée, pour ne pas la laisser orpheline
    data.transactions = data.transactions.filter(x=>x.id!==t.reglementTxId);
  }
  if(t && t.reglementOfId){
    // on supprime la contrepassation elle-même : le tiers d'origine redevient non réglé
    const orig = data.transactions.find(x=>x.id===t.reglementOfId);
    if(orig) delete orig.reglementTxId;
  }
  data.transactions = data.transactions.filter(t=>t.id!==id);
  await saveData();
  closeForm();
  showToast('Opération supprimée');
  renderAll();
}
function isReglee_(t){
  if(t.reglementTxId && data.transactions.some(x=>x.id===t.reglementTxId)) return true;
  return t.regle!==false;
}
function creerContrepassation_(t, dateReglement, extraFields){
  // Contrepassation en banque : une VRAIE écriture séparée dans le journal, sur le même compte
  // de tiers (classe 4) et au nom du même tiers, pour se compenser avec la dette d'origine SANS
  // jamais la modifier — l'historique du tiers reste intact et la comptabilité en partie double aussi.
  if(t.reglementTxId && data.transactions.some(x=>x.id===t.reglementTxId)) return null; // déjà réglé
  const compte = tiersCompteOf(t);
  const nom = t.tiersNom || 'Non précisé';
  const objet = t.comment || (CATEGORIES[t.category] && CATEGORIES[t.category].label) || '';
  const ctx = Object.assign({
    id: uid('tx'), type: t.type, amount: t.amount, date: dateReglement,
    comment: objet ? `Règlement — ${objet} (${nom})` : `Règlement — ${nom}`,
    compteOverride: compte, tresoCompte: t.tresoCompte || '5121',
    tiersNom: nom, reglementOfId: t.id, regle:true, isReglement:true
  }, extraFields||{});
  data.transactions.push(ctx);
  t.reglementTxId = ctx.id;
  return ctx;
}
async function toggleReglement(txId, checked){
  const t = data.transactions.find(t=>t.id===txId);
  if(!t) return;
  if(checked){
    let dr = todayStr();
    const input = prompt('Date de règlement (AAAA-MM-DD) :', dr);
    if(input===null){ renderAll(); return; } // annulé : on réaffiche la ligne pour décocher la case
    if(/^\d{4}-\d{2}-\d{2}$/.test(input.trim())) dr = input.trim();
    creerContrepassation_(t, dr);
  }else{
    if(t.reglementTxId){
      data.transactions = data.transactions.filter(x=>x.id!==t.reglementTxId);
      delete t.reglementTxId;
    }
    // compatibilité avec les règlements enregistrés avant cette mise à jour (sans écriture séparée)
    t.regle = false;
    t.dateReglement = null;
  }
  await saveData();
  showToast(checked ? 'Réglé — écriture de contrepassation créée en banque ✓' : 'Marqué comme non réglé');
  renderAll();
}

/* ============== ÉTAT DES TIERS (401 / 411 / 4672) — pour le CA ============== */
const ETAT_TIERS_COMPTES = ['401','411','4672'];
const ETAT_TIERS_LIBELLES = { '401':'Fournisseurs', '411':'Clients', '4672':'Adhérents - Créances / Dettes' };
function etatTiersLibelle_(compte){
  const l = libelleForCompte(compte);
  return (l && l!==compte) ? l : (ETAT_TIERS_LIBELLES[compte]||compte);
}
function buildEtatTiers(year){
  const cutoff = cutoffForYear(year);
  const entries = tiersDetailAt(cutoff).filter(e=>Math.abs(e.montant)>=0.005);
  const sections = ETAT_TIERS_COMPTES.map(compte=>{
    const rows = entries.filter(e=>e.compte===compte)
      .sort((a,b)=>a.nom.localeCompare(b.nom))
      .map(e=>{
        const ops = data.transactions
          .filter(t=>{
            if(t.date>cutoff) return false;
            if(t.tiersType) return tiersCompteOf(t)===compte && (t.tiersNom||'Non précisé')===e.nom;
            const c = accountForTx(t);
            return /^4/.test(c) && c===compte && (t.tiersNom||null)===e.nom;
          })
          .sort((a,b)=>a.date.localeCompare(b.date))
          .map(t=>({
            date: t.date,
            libelle: t.comment || (CATEGORIES[t.category] ? CATEGORIES[t.category].label : '') || '',
            montant: t.tiersType ? (t.type==='recette' ? t.amount : -t.amount) : (t.type==='recette' ? -t.amount : t.amount)
          }));
        return { nom:e.nom, montant:e.montant, ops };
      });
    const creances = rows.filter(r=>r.montant>0).reduce((s,r)=>s+r.montant,0);
    const dettes = rows.filter(r=>r.montant<0).reduce((s,r)=>s-r.montant,0);
    return { compte, libelle: etatTiersLibelle_(compte), rows, creances, dettes, net: creances-dettes };
  });
  return { year, cutoff, sections };
}
function openEtatTiers(){
  if(!ui.et) ui.et = { detail:false };
  renderEtatTiers();
}
function closeEtatTiers(){
  const el = document.getElementById('et-view');
  if(el) el.remove();
}
function renderEtatTiers(){
  let el = document.getElementById('et-view');
  if(!el){
    el = document.createElement('div');
    el.id = 'et-view';
    el.style.cssText = 'position:fixed;inset:0;z-index:200;background:#fff;overflow:auto;color:#201D18;font-family:Inter,sans-serif;';
    document.body.appendChild(el);
  }
  const years = yearsAvailable();
  const et = buildEtatTiers(ui.year);
  const detail = !!(ui.et && ui.et.detail);
  const totCreances = et.sections.reduce((s,x)=>s+x.creances,0);
  const totDettes = et.sections.reduce((s,x)=>s+x.dettes,0);
  const isCourant = et.year >= exerciceForDate(todayStr());

  const synthRows = et.sections.map(s=>`
    <tr><td class="mono">${s.compte}</td><td>${escapeHtml(s.libelle)}</td><td class="r">${euro(s.creances)}</td><td class="r">${euro(s.dettes)}</td><td class="r"><b>${euro(s.net)}</b></td></tr>`).join('');

  const sectionsHtml = et.sections.map(s=>{
    const body = s.rows.length===0
      ? `<tr><td colspan="4" style="color:#777;text-align:center;">Aucun solde ouvert sur ce compte</td></tr>`
      : s.rows.map(r=>`
        <tr>
          <td>${escapeHtml(r.nom)}</td>
          <td class="r">${r.montant>0?euro(r.montant):''}</td>
          <td class="r">${r.montant<0?euro(-r.montant):''}</td>
          <td class="r">${r.ops.length||''}</td>
        </tr>
        ${detail ? r.ops.map(o=>`
        <tr class="op"><td colspan="4"><span class="ctx">${formatDateShort(o.date)} — ${escapeHtml(o.libelle)}</span><span class="ctx r" style="float:right;">${o.montant>=0?'+ ':'− '}${euro(Math.abs(o.montant))}</span></td></tr>`).join('') : ''}`).join('');
    return `
      <h3>Compte ${s.compte} — ${escapeHtml(s.libelle)}</h3>
      <table>
        <tr><th>Tiers</th><th class="r">Dû au club</th><th class="r">Dû par le club</th><th class="r">Nb op.</th></tr>
        ${body}
        <tr class="tot"><td>Total ${s.compte}</td><td class="r">${euro(s.creances)}</td><td class="r">${euro(s.dettes)}</td><td></td></tr>
      </table>`;
  }).join('');

  el.innerHTML = `
  <style>
    #et-view .bar{position:sticky;top:0;background:#f4f4f2;border-bottom:1px solid #ccc;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2;}
    #et-view .bar button,#et-view .bar select{padding:8px 14px;border-radius:8px;border:1px solid #888;background:#fff;font-size:14px;}
    #et-view .bar button.pri{background:#16233F;color:#fff;border-color:#16233F;}
    #et-view .doc{max-width:760px;margin:0 auto;padding:22px 18px 40px;}
    #et-view h1{font-size:22px;margin:0 0 2px;}
    #et-view h2{font-size:15px;margin:0 0 14px;font-weight:600;color:#444;}
    #et-view h3{font-size:14px;margin:22px 0 6px;color:#16233F;}
    #et-view table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
    #et-view th,#et-view td{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:top;}
    #et-view th{background:#eee;}
    #et-view .r{text-align:right;white-space:nowrap;}
    #et-view .mono{font-family:'IBM Plex Mono',monospace;}
    #et-view tr.tot td{font-weight:700;background:#f4f4f2;}
    #et-view tr.op td{border-top:none;background:#fafaf8;padding:3px 8px 3px 22px;}
    #et-view .ctx{font-size:11px;color:#555;}
    #et-view .note{font-size:11.5px;color:#555;margin-top:14px;line-height:1.5;}
    @media print{ body>*:not(#et-view){display:none!important;} #et-view{position:static!important;overflow:visible!important;} #et-view .no-print{display:none!important;} }
  </style>
  <div class="bar no-print">
    <button onclick="closeEtatTiers()">← Fermer</button>
    <select onchange="ui.year=Number(this.value);renderEtatTiers()">
      ${years.map(y=>`<option value="${y}" ${y===ui.year?'selected':''}>Exercice ${exerciceLabel(y)}</option>`).join('')}
    </select>
    <label style="font-size:13px;display:flex;align-items:center;gap:6px;"><input type="checkbox" style="width:auto;" ${detail?'checked':''} onchange="ui.et.detail=this.checked;renderEtatTiers()"> Détail des opérations</label>
    <button class="pri" onclick="window.print()">🖨 Imprimer / PDF</button>
    <button onclick="exportEtatTiersExcel()">📊 Excel</button>
  </div>
  <div class="doc">
    <h1>${escapeHtml(data.settings.clubName || 'Club')}</h1>
    <h2>État des comptes de tiers (401 / 411 / 4672) — Exercice ${exerciceLabel(et.year)}, arrêté au ${isCourant ? formatDateShort(todayStr()) : formatDateShort(et.cutoff)}</h2>

    <table>
      <tr><th>N°</th><th>Compte</th><th class="r">Dû au club</th><th class="r">Dû par le club</th><th class="r">Solde net</th></tr>
      ${synthRows}
      <tr class="tot"><td colspan="2">Total des tiers</td><td class="r">${euro(totCreances)}</td><td class="r">${euro(totDettes)}</td><td class="r">${euro(totCreances-totDettes)}</td></tr>
    </table>

    ${sectionsHtml}

    <div class="note">Soldes calculés tiers par tiers (une même personne n'est jamais compensée avec une autre). Seules les opérations non réglées à la date d'arrêté sont prises en compte, ainsi que les éventuels soldes d'ouverture non affectés. « Dû au club » = créance à encaisser ; « Dû par le club » = dette restant à payer.</div>
  </div>`;
}
function exportEtatTiersExcel(){
  if(typeof XLSX === 'undefined'){ showToast("Bibliothèque Excel indisponible (pas de connexion)"); return; }
  const et = buildEtatTiers(ui.year);
  const synth = [], det = [];
  et.sections.forEach(s=>{
    s.rows.forEach(r=>{
      synth.push({ 'N° compte':s.compte, Compte:s.libelle, Tiers:r.nom,
        'Dû au club (€)': r.montant>0 ? r.montant : '', 'Dû par le club (€)': r.montant<0 ? -r.montant : '', 'Solde (€)': r.montant });
      r.ops.forEach(o=>det.push({ 'N° compte':s.compte, Tiers:r.nom, Date:o.date, Libellé:o.libelle, 'Montant (€)':o.montant }));
    });
    synth.push({ 'N° compte':s.compte, Compte:s.libelle, Tiers:'TOTAL '+s.compte,
      'Dû au club (€)': s.creances, 'Dû par le club (€)': s.dettes, 'Solde (€)': s.net });
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(synth.length?synth:[{'N° compte':''}]), 'Etat des tiers');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(det.length?det:[{'N° compte':''}]), 'Detail operations');
  XLSX.writeFile(wb, 'etat-tiers-'+exerciceLabel(et.year)+'.xlsx');
  showToast('Export Excel généré ✓');
}

  }catch(err){

}

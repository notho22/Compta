  #nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid var(--line);display:flex;padding:5px 1px 9px;z-index:20;}
  #nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0px;cursor:pointer;color:var(--ink-dim);font-size:8.4px;font-weight:600;letter-spacing:.1px;}

  #overlay{position:fixed;inset:0;z-index:50;display:none;}

  .euro-input{position:relative;}

  #toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:30px;font-size:13px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  #saving-indicator{position:fixed;top:12px;right:12px;background:rgba(22,35,63,.92);color:#fff;font-size:11px;padding:6px 11px;border-radius:20px;display:flex;align-items:center;gap:6px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:70;}

  #saving-indicator .spin{width:10px;height:10px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}

</style>

<body>
<div id="shell">
  <div id="gate">
    <div class="gate-icon">📒</div>
    <h2 class="display">Comptes du club</h2>
    <p>Les données sont stockées sur Google Drive. Connectez-vous avec le compte Google qui a accès au dossier du club pour charger l'application.</p>
    <button class="btn primary" onclick="connectDrive()">🔐 Connecter Google Drive</button>
    <div class="gate-status" id="gate-status"></div>
  </div>
  <div id="topbar"></div>
  <div id="app"></div>
  <div id="nav"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
  <div id="saving-indicator"><span class="spin"></span><span>Enregistrement…</span></div>
</div>

<script>
/* ============== GOOGLE DRIVE — CONFIGURATION ==============
   1) Sur https://console.cloud.google.com : créez un projet, activez "Google Drive API"
      (menu API et services > Bibliothèque).
   2) Configurez l'écran de consentement OAuth (type "Externe" convient pour un petit club ;
      en mode "Test" vous ajoutez les emails des membres autorisés, aucune validation Google requise).
   3) Créez un identifiant OAuth "ID client OAuth" de type "Application Web" :
      - Origines JavaScript autorisées : l'URL exacte où cette page sera hébergée
        (ex : https://votre-compte.github.io)
      - Aucune URI de redirection n'est nécessaire (flux à jeton implicite).
   4) Collez le Client ID obtenu ci-dessous.
   5) Pour que plusieurs comptes Google partagent les mêmes données : un seul compte se connecte
      en premier (il crée le dossier "Comptabilite-Club" dans SON Drive), puis ce compte partage
      ce dossier (clic droit > Partager, rôle "Éditeur") avec l'adresse Gmail de chaque autre
      membre, AVANT que ces membres ne cliquent "Connecter Google Drive". */
const GOOGLE_CLIENT_ID = '796240683229-l60espkuiio4mg2r4d1srkd7retp9p4a.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive';
const DRIVE_FOLDER_NAME = 'Comptabilite-Club';
const DRIVE_FILE_NAME = 'club-comptabilite-data.json';

let gTokenClient = null;
let gAccessToken = null;
let gTokenExpiresAt = 0;
let driveFolderId = null;
let driveFileId = null;

function setGateStatus(msg, isError){
  const el = document.getElementById('gate-status');
  if(el){ el.textContent = msg||''; el.className = 'gate-status'+(isError?' gate-error':''); }
}

function initGoogleAuth(){
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
    setGateStatus("Impossible de charger l'authentification Google (vérifiez votre connexion).", true);
    return;
  }
  if(GOOGLE_CLIENT_ID.indexOf('REMPLACER_PAR_VOTRE_CLIENT_ID')===0){
    setGateStatus("Client ID Google non configuré — voir les commentaires en haut du fichier.", true);
    return;
  }
  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: ()=>{}
  });
}
window.addEventListener('load', initGoogleAuth);

function requestDriveToken(interactive){
  return new Promise((resolve, reject)=>{
    if(!gTokenClient){ reject(new Error("Google Identity Services n'est pas prêt")); return; }
    gTokenClient.callback = (resp)=>{
      if(resp && resp.access_token){
        gAccessToken = resp.access_token;
        gTokenExpiresAt = Date.now() + ((resp.expires_in||3600)*1000) - 60000;
        resolve(gAccessToken);
      } else {
        reject(new Error((resp && resp.error) || 'Autorisation refusée'));
      }
    };
    gTokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
  });
}
async function ensureDriveToken(){
  if(gAccessToken && Date.now() < gTokenExpiresAt) return gAccessToken;
  try{ return await requestDriveToken(false); }
  catch(e){ return await requestDriveToken(true); }
}
async function driveFetch(url, options){
  const token = await ensureDriveToken();
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer '+token });
  const res = await fetch(url, options);
  if(!res.ok){
    const text = await res.text().catch(()=>'');
    throw new Error('Drive API '+res.status+': '+text);
  }
  return res;
}
async function findOrCreateDriveFolder(){
  if(driveFolderId) return driveFolderId;
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
  const json = await res.json();
  if(json.files && json.files.length>0){ driveFolderId = json.files[0].id; return driveFolderId; }
  const createRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' })
  });
  const created = await createRes.json();
  driveFolderId = created.id;
  return driveFolderId;
}
async function findOrCreateDriveFile(){
  const folderId = await findOrCreateDriveFolder();
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME.replace(/'/g,"\\'")}' and '${folderId}' in parents and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
  const json = await res.json();
  if(json.files && json.files.length>0){ driveFileId = json.files[0].id; return driveFileId; }
  const metadata = { name: DRIVE_FILE_NAME, parents:[folderId], mimeType:'application/json' };
  const boundary = '-------clubcompta'+Date.now();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(data)}\r\n`+
    `--${boundary}--`;
  const createRes = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST', headers:{'Content-Type': `multipart/related; boundary=${boundary}`}, body
  });
  const created = await createRes.json();
  driveFileId = created.id;
  return driveFileId;
}
async function connectDrive(){
  setGateStatus('Connexion en cours…');
  try{
    await requestDriveToken(true);
  }catch(e){
    console.error(e);
    setGateStatus("Connexion refusée ou échouée — réessayez.", true);
    return;
  }
  setGateStatus('Chargement des données…');
  await loadData();
}

/* ============== DATA MODEL ============== */
let data = {
  settings: { clubName: 'Mon club', soldeInitial: 0, immoInitial: 0 },
  transactions: [], players: [], trips: [], teams: [], events: [], accounts: [], categoryAccountMap: {}
};
let ui = {
  view: 'accueil', year: (function(){ const d=new Date(); return (d.getMonth()+1)>=9 ? d.getFullYear() : d.getFullYear()-1; })(), journalFilter: 'tous', journalTresoFilter: 'tous', journalTiersOnly: false, journalTiersName: null, journalCompteFilter: null,

function migrateAccountPlanV3_(){
  if(data.planVersion>=3){
    // toujours garder le plan de référence à jour même après le passage en v3
    PLAN_OFFICIEL.forEach(([compte,libelle])=>{
      if(!data.accounts.find(a=>a.compte===compte)) data.accounts.push({compte, libelle});
    });
    return;
  }
  data.accounts.forEach(a=>{ if(RENOMMAGE_COMPTES_V3[a.compte]) a.compte = RENOMMAGE_COMPTES_V3[a.compte]; });
  data.transactions.forEach(t=>{
    if(t.tresoCompte && RENOMMAGE_COMPTES_V3[t.tresoCompte]) t.tresoCompte = RENOMMAGE_COMPTES_V3[t.tresoCompte];
    if(t.compteOverride && RENOMMAGE_COMPTES_V3[t.compteOverride]) t.compteOverride = RENOMMAGE_COMPTES_V3[t.compteOverride];
    if(t.compteTiers && RENOMMAGE_COMPTES_V3[t.compteTiers]) t.compteTiers = RENOMMAGE_COMPTES_V3[t.compteTiers];
  });
  Object.keys(data.categoryAccountMap).forEach(k=>{
    if(RENOMMAGE_COMPTES_V3[data.categoryAccountMap[k]]) data.categoryAccountMap[k] = RENOMMAGE_COMPTES_V3[data.categoryAccountMap[k]];
  });
  Object.keys(ANCIENS_DEFAUTS_V3).forEach(k=>{
    const cur = data.categoryAccountMap[k];
    if(!cur || cur===ANCIENS_DEFAUTS_V3[k]) data.categoryAccountMap[k] = CATEGORIES[k].compte;
  });
  const enUsage = new Set();
  data.transactions.forEach(t=>{ if(t.compteOverride) enUsage.add(t.compteOverride); if(t.compteTiers) enUsage.add(t.compteTiers); });
  Object.values(data.categoryAccountMap).forEach(c=>enUsage.add(c));
  data.accounts = data.accounts.filter(a=>!COMPTES_A_SUPPRIMER_V3.includes(a.compte) || enUsage.has(a.compte));
  PLAN_OFFICIEL.forEach(([compte,libelle])=>{
    const a = data.accounts.find(a=>a.compte===compte);
    if(a) a.libelle = libelle; else data.accounts.push({compte, libelle});

/* ============== CALCULS COMPTABLES ============== */
function exerciceForDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const m = d.getMonth()+1;
  return m>=9 ? d.getFullYear() : d.getFullYear()-1;
}
function exerciceLabel(year){ return `${year}-${year+1}`; }
function yearsAvailable(){
  const ys = new Set(data.transactions.map(t=>exerciceForDate(t.date)));
  ys.add(exerciceForDate(todayStr()));
  return Array.from(ys).sort((a,b)=>b-a);
}
function treasuryAt(cutoffDate, compteFilter){
  let bal = 0;
  if(compteFilter) bal += soldeOuvertureFor(compteFilter);
  else TRESO_COMPTES.forEach(c=>{ bal += soldeOuvertureFor(c); });
  data.transactions.forEach(t=>{
    if(t.regle===false) return;
    if(compteFilter && (t.tresoCompte||'5121')!==compteFilter) return;
    const cashDate = t.dateReglement || t.date;
    if(cashDate<=cutoffDate) bal += (t.type==='recette'? t.amount : -t.amount);
  });
  return bal;
}
function tiersDetailAt(cutoffDate){
  // Compensation par TIERS NOMMÉ (compte + personne), pas globalement par compte :
  // deux personnes sur le même compte (ex. 4672) ne doivent jamais se compenser entre elles.
  const net = {};
  Object.keys(data.settings.soldesOuverture||{}).forEach(c=>{
    if(!TRESO_COMPTES.includes(c) && c!=='218' && c!=='110' && soldeOuvertureFor(c)!==0){
      const key = c+'|__ouverture__';
      net[key] = { compte:c, nom:"Solde d'ouverture (non affecté)", montant: soldeOuvertureFor(c) };
    }
  });
  data.transactions.forEach(t=>{
    if(t.regle!==false || !t.tiersType || t.date>cutoffDate) return;
    const c = tiersCompteOf(t);
    const nom = t.tiersNom || 'Non précisé';
    const key = c+'|'+nom;
    if(!net[key]) net[key] = { compte:c, nom, montant:0 };
    net[key].montant += (t.type==='recette' ? t.amount : -t.amount);
  });
  return Object.values(net);
}
function immoAt(cutoffDate){
  let v = soldeOuvertureFor('218');
  data.transactions.forEach(t=>{ if(t.date<=cutoffDate && t.type==='depense' && t.immo) v += t.amount; });
  return v;
}
function resultForYear(year){
  let produits=0, charges=0;
  const prodByCompte={}, chgByCompte={};
  let immoAchats=0;
  data.transactions.filter(t=>exerciceForDate(t.date)===year).forEach(t=>{
    const compte = accountForTx(t);
    if(t.type==='recette'){ produits+=t.amount; prodByCompte[compte]=(prodByCompte[compte]||0)+t.amount; }
    else if(t.immo){ immoAchats += t.amount; }
    else { charges+=t.amount; chgByCompte[compte]=(chgByCompte[compte]||0)+t.amount; }
  });
  return { produits, charges, resultat: produits-charges, prodByCompte, chgByCompte, immoAchats };
}
function resultBeforeYear(year){
  let produits=0, charges=0;
  data.transactions.filter(t=>exerciceForDate(t.date)<year).forEach(t=>{
    if(t.type==='recette') produits+=t.amount; else if(!t.immo) charges+=t.amount;
  });
  return produits-charges;
}
function cutoffForYear(year){
  const currentEx = exerciceForDate(todayStr());
  return year>=currentEx ? todayStr() : `${year+1}-08-31`;
}
function ageFromBirth(dateStr){
  if(!dateStr) return null;
  const b=new Date(dateStr+'T00:00:00'), t=new Date();
  let age=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) age--;
  return age;
}
function playerNameFor(id){
  const p = data.players.find(p=>p.id===id);
  return p ? `${p.prenom} ${p.nom}` : '';
}
function licenseStatus(p){
  if(!p.licenses.length) return {label:'Aucune licence', cls:'bad'};
  const last = [...p.licenses].sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0];
  const days = (new Date(todayStr()) - new Date(last.date))/86400000;
  if(days<=365) return {label:'À jour', cls:'ok'};
  return {label:'À renouveler', cls:'warn'};
}

function monthlyTreasurySeries(year){
  const pad = n=>String(n).padStart(2,'0');
  const points = [];
  points.push({label:'Août '+String(year).slice(2), value: treasuryAt(`${year}-08-31`)});
  const todayD = new Date();
  for(let i=0;i<12;i++){
    let m = 9+i, yy = year;
    if(m>12){ m-=12; yy=year+1; }
    const lastDay = new Date(yy, m, 0).getDate();
    const monthEndDate = new Date(yy, m-1, lastDay);
    if(monthEndDate > todayD) break;
    let cutoff = `${yy}-${pad(m)}-${pad(lastDay)}`;
    if(cutoff > todayStr()) cutoff = todayStr();
    points.push({label: moisLabel(m-1), value: treasuryAt(cutoff)});
  }
  return points;
}

  if(!armedDeletes.has(key)){

    if(el) el.textContent = 'Confirmer ?';
    setTimeout(()=>{ armedDeletes.delete(key); if(el && document.body.contains(el)) el.textContent=normalLabel; }, 3000);

  armedDeletes.delete(key);
  cb();
}

function buildTresorerieChart(points){
  const values = points.map(p=>p.value);
  const minV = Math.min(0, ...values);
  const maxV = Math.max(0, ...values);
  const range = (maxV-minV) || 1;
  const w=400, h=150, padL=6, padR=6, padT=10, padB=20;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const stepX = plotW/((points.length-1)||1);
  const xy = points.map((p,i)=>{
    const x = padL + i*stepX;
    const y = padT + plotH - ((p.value-minV)/range)*plotH;
    return {x,y,label:p.label,value:p.value};
  });
  const zeroY = padT + plotH - ((0-minV)/range)*plotH;
  const pathD = xy.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  let minIdx=0; xy.forEach((p,i)=>{ if(p.value<xy[minIdx].value) minIdx=i; });
  const dots = xy.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i===minIdx?4:2.3}" fill="${i===minIdx?'#B23A22':'#16233F'}"/>`).join('');
  const labels = xy.map(p=>`<text x="${p.x.toFixed(1)}" y="${h-4}" font-size="8" text-anchor="middle" fill="#726C5C">${p.label}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="#E2DCC9" stroke-width="1"/>
    <path d="${pathD}" fill="none" stroke="#16233F" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}

function ageBucketsList(){
  return [

    {label:'11-12 ans', min:11, max:12},

    {label:'16-17 ans', min:16, max:17},

    {label:'Sénior +35 (35-39 ans)', min:35, max:39},
    {label:'Master +40 (40-99 ans)', min:40, max:99},

function bucketFor(age){
  if(age===null || age===undefined) return null;
  const buckets = ageBucketsList();
  for(const b of buckets){ if(age>=b.min && age<=b.max) return b.label; }
  return 'Master +40 (40-99 ans)';

  if(total===0) return '';
  const genders = {};
  data.players.forEach(p=>{ genders[p.gender]=(genders[p.gender]||0)+1; });
  const genderBars = Object.entries(genders).map(([g,n])=>barRow(g, n, total)).join('');

  const order = ageBucketsList().map(b=>b.label);
  const counts = {};
  data.players.forEach(p=>{ const b=bucketFor(ageFromBirth(p.birthDate)); if(b) counts[b]=(counts[b]||0)+1; });
  const ageBars = order.filter(l=>counts[l]).map(l=>barRow(l, counts[l], total)).join('');

  return `
    <h2 class="section-title">Indicateurs</h2>
    <div class="card">
      <div class="indic-sub">Répartition par genre</div>
      ${genderBars}
      <div class="indic-sub" style="margin-top:12px;">Répartition par catégorie d'âge</div>
      ${ageBars}
    </div>`;
}

/* ============== DEPLACEMENTS : CALCUL ============== */
function participantName(p){ return p.playerId ? (playerNameFor(p.playerId)||p.nom) : p.nom; }
function tripCalc(trip){
  const participants = trip.participants;
  const nTotal = participants.length;
  const nJoueurs = participants.filter(p=>p.role==='joueur').length;
  const nCoachs = participants.filter(p=>p.role==='coach').length;
  const nAccomp = participants.filter(p=>p.role==='accompagnateur').length;
  const nRepasTournoi = nJoueurs + nAccomp;
  const transportTotal = trip.vehicles.reduce((s,v)=>s+(Number(v.carburant)||0)+(Number(v.peages)||0)+(Number(v.stationnement)||0),0);
  const transportShare = nTotal>0 ? transportTotal/nTotal : 0;
  const hebergementShare = nTotal>0 ? (Number(trip.couts.hebergement)||0)/nTotal : 0;
  const repasShare = nRepasTournoi>0 ? (Number(trip.couts.repas)||0)/nRepasTournoi : 0;
  const tournoiShare = nRepasTournoi>0 ? (Number(trip.couts.tournoi)||0)/nRepasTournoi : 0;
  const subventionParJoueur = Number(trip.priseEnChargeClub)||0;

  const montants = {};
  participants.forEach(p=>{
    let m;
    if(p.role==='coach') m = transportShare+hebergementShare;
    else if(p.role==='accompagnateur') m = transportShare+hebergementShare+repasShare+tournoiShare;
    else m = Math.max(0, transportShare+hebergementShare+repasShare+tournoiShare - subventionParJoueur);
    montants[p.id] = m;
  });

  const totalCosts = transportTotal + (Number(trip.couts.hebergement)||0) + (Number(trip.couts.repas)||0) + (Number(trip.couts.tournoi)||0);
  const totalCollectePrevu = Object.values(montants).reduce((a,b)=>a+b,0);
  const totalCollecteRecu = participants.filter(p=>p.paiementRecu).reduce((s,p)=>s+(montants[p.id]||0),0);

  return { nTotal, nJoueurs, nCoachs, nAccomp, nRepasTournoi, transportTotal, transportShare, hebergementShare, repasShare, tournoiShare, subventionParJoueur, montants, totalCosts, totalCollectePrevu, totalCollecteRecu };
}

function removeParticipantObj_(trip, part){
  trip.vehicles.forEach(v=>{ v.occupantIds = v.occupantIds.filter(id=>id!==part.id); });
  if(part.txId) data.transactions = data.transactions.filter(t=>t.id!==part.txId);
  (part.subventionTxIds||[]).forEach(id=>{ data.transactions = data.transactions.filter(t=>t.id!==id); });
  trip.participants = trip.participants.filter(p=>p.id!==part.id);
}

async function finalizeTrip(tripId){
  const trip = data.trips.find(t=>t.id===tripId);
  if(trip.finalized) return;
  if(trip.participants.length===0){ showToast('Ajoutez au moins un participant avant de finaliser'); return; }
  const calc = tripCalc(trip);

  trip.vehicles.forEach(v=>{
    v.txIds = [];
    const fields = [['carburant','carburant','Carburant'],['peages','peages','Péages'],['stationnement','stationnement','Stationnement']];
    const tiersNom = v.conducteurPlayerId ? playerNameFor(v.conducteurPlayerId) : (v.conducteur || 'Conducteur');
    fields.forEach(([f,nature,label])=>{
      const amt = Number(v[f])||0;
      if(amt>0){
        const tx = { id: uid('tx'), type:'depense', category:'deplacement_vehicules', amount:amt, date:trip.date, comment:`${label} — véhicule ${v.conducteur||''} (${trip.nom})`, tripId:trip.id, vehicleId:v.id, playerId: v.conducteurPlayerId||undefined, natureDeplacement:nature, regle:false, tiersType:'fournisseur', tiersNom, tiersPlayerId: v.conducteurPlayerId||undefined, compteTiers: v.conducteurPlayerId ? '4672' : '401' };
        data.transactions.push(tx);
        v.txIds.push(tx.id);
      }
    });
  });

  trip.coutsGenerauxTxIds = [];
  const gfields = [['tournoi','tournoi','Tournoi'],['repas','repas','Repas'],['hebergement','hebergement','Hébergement']];
  gfields.forEach(([f,nature,label])=>{
    const amt = Number(trip.couts[f])||0;
    if(amt>0){
      const tx = { id: uid('tx'), type:'depense', category:'deplacement_general', amount:amt, date:trip.date, comment:`${label} — ${trip.nom}`, tripId:trip.id, natureDeplacement:nature, regle:false, tiersType:'fournisseur', tiersNom: trip.nom, compteTiers:'401' };
      data.transactions.push(tx);
      trip.coutsGenerauxTxIds.push(tx.id);
    }
  });

  trip.participants.forEach(p=>{
    const montant = Math.round((calc.montants[p.id]||0)*100)/100;
    if(montant>0){
      const tx = { id: uid('tx'), type:'recette', category:'deplacement_participation', amount: montant, date: trip.date, comment: `Participation déplacement — ${participantName(p)} (${trip.nom})`, playerId: p.playerId||undefined, tripId: trip.id, regle:false, tiersType:'client', tiersNom: participantName(p), tiersPlayerId: p.playerId||undefined, compteTiers: p.playerId ? '4672' : '401' };
      data.transactions.push(tx);
      p.txId = tx.id;
    }
  });

  trip.finalized = true;
  await saveData();
  showToast('Déplacement finalisé — écritures fournisseurs/clients créées ✓');
  renderAll();
}
async function deleteTrip(tripId){
  const trip = data.trips.find(t=>t.id===tripId);
  if(trip){
    const txIds = new Set();
    trip.vehicles.forEach(v=>{ (v.txIds||[]).forEach(id=>txIds.add(id)); (v.remboursementTxIds||[]).forEach(id=>txIds.add(id)); });
    trip.participants.forEach(p=>{ if(p.txId) txIds.add(p.txId); (p.subventionTxIds||[]).forEach(id=>txIds.add(id)); });
    (trip.coutsGenerauxTxIds||[]).forEach(id=>txIds.add(id));
    data.transactions = data.transactions.filter(t=>!txIds.has(t.id));
  }
  data.trips = data.trips.filter(t=>t.id!==tripId);
  await saveData();
  ui.selectedTripId = null;
  showToast('Déplacement supprimé');
  renderAll();
}

function renderEtatDeplacements(){
  const years = yearsAvailable();
  const natures = [
    ['carburant','Carburant'],['peages','Péages'],['stationnement','Stationnement'],
    ['tournoi','Tournoi'],['repas','Repas'],['hebergement','Hébergement']
  ];
  const txYear = data.transactions.filter(t=>t.tripId && exerciceForDate(t.date)===ui.year);
  const totals = {};
  natures.forEach(([n])=>totals[n]=0);
  let priseCharge = 0;
  txYear.forEach(t=>{
    if(t.natureDeplacement && totals.hasOwnProperty(t.natureDeplacement)) totals[t.natureDeplacement]+=t.amount;
    if(t.natureDeplacement==='prise_charge') priseCharge += t.amount;
  });
  const totalGeneral = natures.reduce((s,[n])=>s+totals[n],0);
  const collecte = data.transactions.filter(t=>t.type==='recette'&&t.category==='deplacement_participation'&&exerciceForDate(t.date)===ui.year).reduce((s,t)=>s+t.amount,0);

  document.getElementById('app').innerHTML = `

    <div class="card">
      <table class="report">
        ${natures.map(([n,label])=>`<tr><td>${escapeHtml(label)}</td><td class="v">${euro(totals[n])}</td></tr>`).join('')}
        <tr class="total"><td>Total coûts réels</td><td class="v">${euro(totalGeneral)}</td></tr>
        <tr><td>Prise en charge club</td><td class="v">${euro(priseCharge)}</td></tr>

  `;

/* ============== EVENEMENTS : CALCUL ============== */
function eventCalc(ev){
  const txs = data.transactions.filter(t=>t.eventId===ev.id);
  const totalDepenses = txs.filter(t=>t.type==='depense').reduce((s,t)=>s+t.amount,0);
  const totalRecettes = txs.filter(t=>t.type==='recette').reduce((s,t)=>s+t.amount,0);
  const enAttente = txs.filter(t=>t.regle===false);
  return { totalDepenses, totalRecettes, solde: totalRecettes-totalDepenses, enAttenteCount: enAttente.length, enAttenteMontant: enAttente.reduce((s,t)=>s+t.amount,0) };
}

async function saveSettings(){

async function updateSoldeOuverture(compte, value){
  if(!data.settings.soldesOuverture) data.settings.soldesOuverture = {};
  data.settings.soldesOuverture[compte] = parseFloat(value)||0;
  await saveData();
  renderAll();
}
async function updateAccountLibelle(compte, value){
  const a = data.accounts.find(a=>a.compte===compte);
  if(a){ a.libelle = value; await saveData(); }
}
async function addAccount(){
  const compteEl = document.getElementById('new-compte');
  const libEl = document.getElementById('new-libelle');
  const compte = compteEl.value.trim();
  const libelle = libEl.value.trim();
  if(!compte || !libelle){ showToast('Indiquez un numéro et un libellé'); return; }
  if(data.accounts.find(a=>a.compte===compte)){ showToast('Ce numéro de compte existe déjà'); return; }
  data.accounts.push({compte, libelle});
  await saveData();
  showToast('Compte ajouté ✓');
  renderAll();
}
async function deleteAccount(compte){
  data.accounts = data.accounts.filter(a=>a.compte!==compte);
  await saveData();
  showToast('Compte supprimé');
  renderAll();
}
async function updateCategoryMapping(catKey, compte){
  if(compte) data.categoryAccountMap[catKey] = compte; else delete data.categoryAccountMap[catKey];
  await saveData();
  showToast('Correspondance mise à jour ✓');
}
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'comptes-club-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function handleImportFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const imported = JSON.parse(ev.target.result);
      if(!imported || typeof imported!=='object' || !Array.isArray(imported.transactions)){
        showToast('Fichier JSON invalide'); return;
      }
      if(!imported.players) imported.players = [];
      if(!imported.trips) imported.trips = [];
      if(!imported.events) imported.events = [];
      if(!imported.teams) imported.teams = [];
      if(!imported.settings) imported.settings = { clubName:'Mon club', soldeInitial:0, immoInitial:0 };
      ui.pendingImport = imported;
      renderAll();
    }catch(err){ showToast('Fichier JSON illisible'); }
  };
  reader.readAsText(file);
}
async function confirmImport(){
  if(!ui.pendingImport) return;

  applyCustomCategories_();

  migrateAccountPlanV3_();
  migrateOpeningBalances_();
  migrateCategoryRenames_();
  migrateTripsShape_();
  ui.pendingImport = null;
  await saveData();
  showToast('Données importées ✓');

}
function cancelImport(){
  ui.pendingImport = null;

}
function exportExcel(){
  if(typeof XLSX === 'undefined'){ showToast("Bibliothèque Excel indisponible (pas de connexion)"); return; }
  const wb = XLSX.utils.book_new();

  const journalRows = [...data.transactions].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{
    const cat = CATEGORIES[t.category]||{};
    return {
      Date: t.date, Type: t.type==='recette' ? 'Recette' : 'Dépense',
      'N° compte': accountForTx(t), Compte: libelleForCompte(accountForTx(t)),
      'Montant (€)': t.amount, Commentaire: t.comment || '',
      Joueur: t.playerId ? playerNameFor(t.playerId) : '', Investissement: t.immo ? 'Oui' : 'Non'
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(journalRows.length?journalRows:[{Date:''}]), 'Journal');

  yearsAvailable().slice().sort((a,b)=>a-b).forEach(year=>{
    const r = resultForYear(year);
    const resRows = [];
    resRows.push({Classe:"Classe 7", "N° compte":"", Libellé:"PRODUITS D'EXPLOITATION", "Montant (€)":""});
    sortCompteEntries(Object.entries(r.prodByCompte)).forEach(([c,v])=>resRows.push({Classe:'', 'N° compte':c, Libellé:libelleForCompte(c), 'Montant (€)':v}));
    resRows.push({Classe:'', 'N° compte':'', Libellé:'Total Classe 7 — Produits', 'Montant (€)':r.produits});
    resRows.push({Classe:"Classe 6", "N° compte":"", Libellé:"CHARGES D'EXPLOITATION", "Montant (€)":""});
    sortCompteEntries(Object.entries(r.chgByCompte)).forEach(([c,v])=>resRows.push({Classe:'', 'N° compte':c, Libellé:libelleForCompte(c), 'Montant (€)':v}));
    resRows.push({Classe:'', 'N° compte':'', Libellé:'Total Classe 6 — Charges', 'Montant (€)':r.charges});
    resRows.push({Classe:'', 'N° compte':'12', Libellé:"RÉSULTAT DE L'EXERCICE", 'Montant (€)':r.resultat});
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resRows), ('Resultat '+exerciceLabel(year)).slice(0,31));

    const cutoff = cutoffForYear(year);
    const tresoBanque=treasuryAt(cutoff,'5121'), tresoLivretA=treasuryAt(cutoff,'5122'), tresoCaisse=treasuryAt(cutoff,'530'), immo=immoAt(cutoff);
    const tiersEntriesX = tiersDetailAt(cutoff).filter(e=>Math.abs(e.montant)>=0.005)
      .sort((a,b)=> a.compte.localeCompare(b.compte, undefined, {numeric:true}) || a.nom.localeCompare(b.nom));
    const tiersActifX = tiersEntriesX.filter(e=>e.montant>0), tiersPassifX = tiersEntriesX.filter(e=>e.montant<0);
    const totTA = tiersActifX.reduce((a,e)=>a+e.montant,0), totTP = tiersPassifX.reduce((a,e)=>a-e.montant,0);
    const fondsInitiaux=soldeOuvertureFor('110');
    const reportAnterieur = fondsInitiaux+resultBeforeYear(year);
    const bilanRows = [
      {Rubrique:'ACTIF', 'N° compte':'', Libellé:'', 'Montant (€)':''},
      {Rubrique:'', 'N° compte':COMPTE_IMMO.compte, Libellé:COMPTE_IMMO.libelle, 'Montant (€)':immo},
      ...tiersActifX.map(e=>({Rubrique:'', 'N° compte':e.compte, Libellé:e.nom, 'Montant (€)':e.montant})),
      {Rubrique:'', 'N° compte':COMPTE_BANQUE.compte, Libellé:COMPTE_BANQUE.libelle, 'Montant (€)':tresoBanque},
      {Rubrique:'', 'N° compte':COMPTE_LIVRETA.compte, Libellé:COMPTE_LIVRETA.libelle, 'Montant (€)':tresoLivretA},
      {Rubrique:'', 'N° compte':COMPTE_CAISSE.compte, Libellé:COMPTE_CAISSE.libelle, 'Montant (€)':tresoCaisse},
      {Rubrique:'', 'N° compte':'', Libellé:'TOTAL ACTIF', 'Montant (€)':tresoBanque+tresoLivretA+tresoCaisse+immo+totTA},
      {Rubrique:'PASSIF', 'N° compte':'', Libellé:'', 'Montant (€)':''},
      {Rubrique:'', 'N° compte':COMPTE_FONDS.compte, Libellé:COMPTE_FONDS.libelle, 'Montant (€)':reportAnterieur},
      {Rubrique:'', 'N° compte':COMPTE_RESULTAT.compte, Libellé:COMPTE_RESULTAT.libelle, 'Montant (€)':r.resultat},
      ...tiersPassifX.map(e=>({Rubrique:'', 'N° compte':e.compte, Libellé:e.nom, 'Montant (€)':-e.montant})),
      {Rubrique:'', 'N° compte':'', Libellé:'TOTAL PASSIF', 'Montant (€)':reportAnterieur+r.resultat+totTP},
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bilanRows), ('Bilan '+exerciceLabel(year)).slice(0,31));
  });

  const stockItems = data.transactions.filter(t=>t.type==='depense'&&t.immo).map(t=>{
    const ageYears = (new Date()-new Date(t.date+'T00:00:00'))/(365.25*86400000);
    return {
      Désignation: t.designation || t.comment || 'Matériel', "Date d'achat": t.date, 'Valeur (€)': t.amount,
      'Âge (années)': Math.round(ageYears*10)/10, 'Durée de vie estimée (années)': t.dureeVie || 5
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stockItems.length?stockItems:[{Désignation:''}]), 'Stock');

  const joueursRows = data.players.map(p=>({
    Prénom: p.prenom, Nom: p.nom, 'Date de naissance': p.birthDate || '',
    "Âge": ageFromBirth(p.birthDate), Catégorie: bucketFor(ageFromBirth(p.birthDate))||"", Genre: p.gender || "",
    "Équipes": (p.teamIds||[]).map(tid=>{const t=data.teams.find(t=>t.id===tid);return t?t.nom:'';}).filter(Boolean).join(', '),
    'Nb licences': p.licenses.length,
    'Dernière licence': p.licenses.length ? [...p.licenses].sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0].date : ''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(joueursRows.length?joueursRows:[{Prénom:''}]), 'Joueurs');

  const tripRows = [];
  data.trips.forEach(t=>{
    const c = tripCalc(t);
    t.participants.forEach(p=>{
      tripRows.push({
        Déplacement: t.nom, Date: t.date, Participant: participantName(p), Rôle: p.role,
        'Montant dû (€)': Math.round((c.montants[p.id]||0)*100)/100, 'Virement reçu': p.paiementRecu?'Oui':'Non'
      });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tripRows.length?tripRows:[{Déplacement:''}]), 'Deplacements');

  XLSX.writeFile(wb, 'comptes-club-'+todayStr()+'.xlsx');
  showToast('Export Excel généré ✓');
}

async function handleScanJustificatif(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const statusEl = document.getElementById('f-scan-status');
  const btnEl = document.getElementById('f-scan-btn');
  if(!statusEl || !btnEl) return;
  if(typeof Tesseract === 'undefined'){
    statusEl.style.display = 'block';
    statusEl.textContent = "La lecture automatique n'a pas pu se charger (connexion internet nécessaire la première fois).";
    return;
  }
  btnEl.disabled = true;
  statusEl.style.display = 'block';
  statusEl.textContent = 'Lecture du justificatif en cours… (quelques secondes)';
  try{
    const result = await Tesseract.recognize(file, 'fra', {
      logger: m=>{
        if(m.status==='recognizing text' && statusEl){
          statusEl.textContent = 'Lecture en cours… '+Math.round((m.progress||0)*100)+'%';
        }
      }
    });
    const text = (result && result.data && result.data.text) || '';
    const parsed = parseReceiptText_(text);
    let found = [];
    if(parsed.amount!=null){
      const amountEl = document.getElementById('f-amount');
      if(amountEl){ amountEl.value = parsed.amount; found.push('montant: '+parsed.amount+' €'); }
    }
    if(parsed.date){
      const dateEl = document.getElementById('f-date');
      if(dateEl){ dateEl.value = parsed.date; found.push('date: '+parsed.date); }
    }
    statusEl.textContent = found.length ? ('Détecté — '+found.join(', ')+'. Vérifiez avant d\'enregistrer.') : "Aucun montant/date détecté avec certitude — vérifiez ou saisissez manuellement.";
  }catch(e){
    console.error('Erreur OCR', e);
    statusEl.textContent = 'Erreur pendant la lecture du justificatif — saisissez manuellement.';
  }finally{
    btnEl.disabled = false;
  }
}

function parseReceiptText_(text){
  const result = { amount: null, date: null };
  if(!text) return result;
  const clean = text.replace(/\u00a0/g,' ');

  // --- Montant : on cherche en priorité un nombre proche des mots "total"/"montant"/"net à payer" ---
  const lines = clean.split(/\r?\n/);
  const amountRe = /(\d{1,4}[.,]\d{2})\s*€?/g;
  let bestAmount = null;
  let bestScore = -1;
  for(const line of lines){
    const lower = line.toLowerCase();
    let score = 0;
    if(/total|net à payer|net a payer|montant|à payer|a payer/.test(lower)) score += 3;
    if(/ttc/.test(lower)) score += 1;
    if(/sous[-\s]?total|dont tva|tva\s*:/.test(lower)) score -= 2;
    let m;
    amountRe.lastIndex = 0;
    while((m = amountRe.exec(line))){
      const val = parseFloat(m[1].replace(',', '.'));
      if(isNaN(val) || val<=0 || val>99999) continue;
      if(score > bestScore || (score===bestScore && (bestAmount===null || val>bestAmount))){
        bestScore = score; bestAmount = val;
      }
    }
  }
  if(bestAmount===null){
    // repli : le plus grand montant trouvé dans tout le texte
    let m, max=null;
    amountRe.lastIndex = 0;
    while((m = amountRe.exec(clean))){
      const val = parseFloat(m[1].replace(',', '.'));
      if(!isNaN(val) && val>0 && val<99999 && (max===null || val>max)) max = val;
    }
    bestAmount = max;
  }
  if(bestAmount!==null) result.amount = Math.round(bestAmount*100)/100;

  // --- Date : jj/mm/aaaa, jj-mm-aaaa, ou "12 janvier 2026" ---
  const moisMap = {janvier:1,février:2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,aout:8,septembre:9,octobre:10,novembre:11,décembre:12,decembre:12};
  let dateMatch = clean.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(dateMatch){
    let [,d,mo,y] = dateMatch;
    if(y.length===2) y = (parseInt(y)<70?'20':'19')+y;
    d=d.padStart(2,'0'); mo=mo.padStart(2,'0');
    if(parseInt(mo)>=1 && parseInt(mo)<=12 && parseInt(d)>=1 && parseInt(d)<=31){
      result.date = `${y}-${mo}-${d}`;
    }
  }
  if(!result.date){
    const litRe = /(\d{1,2})\s+(janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)\s+(\d{4})/i;
    const lm = clean.match(litRe);
    if(lm){
      const d = lm[1].padStart(2,'0');
      const mo = String(moisMap[lm[2].toLowerCase()]).padStart(2,'0');
      result.date = `${lm[3]}-${mo}-${d}`;
    }
  }
  return result;
}

async function submitForm(){
  const cat = CATEGORIES[ui.formCat];
  const amount = parseFloat(document.getElementById('f-amount').value);
  const date = document.getElementById('f-date').value;
  const comment = document.getElementById('f-comment').value.trim();
  const compteSel = document.getElementById('f-compte').value;
  const immoBox = document.getElementById('f-immo');
  const designationEl = document.getElementById('f-designation');
  const dureeEl = document.getElementById('f-duree');
  const regleSel = document.getElementById('f-regle').value;
  const tresoSel = document.getElementById('f-treso').value;
  const tiersPlayerId = document.getElementById('f-tiers-player').value || undefined;
  const tiersNomInput = document.getElementById('f-tiers-nom').value.trim();
  const compteTiersSel = document.getElementById('f-tiers-compte').value;

  if(!amount || amount<=0){ showToast('Indiquez un montant valide'); return; }
  if(!date){ showToast('Indiquez une date'); return; }

  const immoVal = immoBox ? immoBox.checked : false;
  const designation = (immoVal && designationEl) ? designationEl.value.trim() : undefined;
  const dureeVie = (immoVal && dureeEl) ? (parseInt(dureeEl.value)||5) : undefined;
  const compteOverride = compteSel!==compteFor(ui.formCat) ? compteSel : undefined;
  const regleVal = regleSel==='oui';
  const tiersType = cat.type==='depense' ? 'fournisseur' : 'client';
  const tiersNom = tiersPlayerId ? playerNameFor(tiersPlayerId) : tiersNomInput;

  if(ui.editId){
    const t = data.transactions.find(t=>t.id===ui.editId);
    t.amount=amount; t.date=date; t.comment=comment; t.immo=immoVal; t.tresoCompte=tresoSel;
    if(compteOverride) t.compteOverride=compteOverride; else delete t.compteOverride;
    if(immoVal){ t.designation=designation; t.dureeVie=dureeVie; } else { delete t.designation; delete t.dureeVie; }
    t.regle = regleVal;
    if(!regleVal){ t.tiersType=tiersType; t.tiersNom=tiersNom||'Non précisé'; t.tiersPlayerId=tiersPlayerId; t.compteTiers=compteTiersSel; if(t.dateReglement===undefined) t.dateReglement=null; }
    else { t.dateReglement = t.dateReglement || null; }
  } else {
    const tx = { id: uid('tx'), type: cat.type, category: ui.formCat, amount, date, comment, immo: immoVal, regle: regleVal, tresoCompte: tresoSel };
    if(compteOverride) tx.compteOverride=compteOverride;
    if(immoVal){ tx.designation=designation; tx.dureeVie=dureeVie; }
    if(!regleVal){ tx.tiersType=tiersType; tx.tiersNom=tiersNom||'Non précisé'; tx.tiersPlayerId=tiersPlayerId; tx.compteTiers=compteTiersSel; tx.dateReglement=null; }
    if(ui.formEventId) tx.eventId = ui.formEventId;
    data.transactions.push(tx);
  }
  await saveData();
  closeForm();
  showToast('Opération enregistrée ✓');
  renderAll();
}
async function deleteTx(id){
  data.transactions = data.transactions.filter(t=>t.id!==id);
  await saveData();
  closeForm();
  showToast('Opération supprimée');
  renderAll();
}
async function toggleReglement(txId, checked){
  const t = data.transactions.find(t=>t.id===txId);
  if(!t) return;
  t.regle = checked;
  t.dateReglement = checked ? todayStr() : null;
  await saveData();
  showToast(checked ? 'Marqué comme réglé ✓' : 'Marqué comme non réglé');
  renderAll();
}

  showToast('Licence supprimée');

}

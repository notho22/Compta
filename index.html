<style>
  #gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;gap:14px;}

<style>
  :root{
    --navy:#16233F; --navy-2:#20355C; --navy-dim:#E8EAF1;
    --green:#2F9E44; --green-dim:#DFF0E2;
    --amber:#C97A1A; --amber-dim:#FBEAD2;
    --paper:#F5F2EA; --card:#FFFFFF; --ink:#201D18; --ink-dim:#726C5C; --line:#E2DCC9;
    --red:#B23A22; --red-dim:#F6E1D9; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  body{display:flex;justify-content:center;}
  #shell{width:100%;max-width:460px;min-height:100vh;background:var(--paper);position:relative;display:flex;flex-direction:column;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .display{font-family:'Oswald',sans-serif;}

  #topbar{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:22px 20px 26px;border-radius:0 0 22px 22px;}
  #topbar .club{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;opacity:.75;margin:0 0 10px;}
  #topbar .board{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  #topbar .solde-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7;margin-bottom:4px;}
  #topbar .solde-val{font-family:'Oswald',sans-serif;font-weight:700;font-size:38px;line-height:1;letter-spacing:.5px;font-variant-numeric:tabular-nums;}
  #topbar .sub-metrics{display:flex;gap:18px;margin-top:14px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px;}
  #topbar .metric{font-size:11px;opacity:.85;}
  #topbar .metric b{display:block;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;margin-top:2px;}

  #app{flex:1;padding:18px 16px 90px;}
  h2.section-title{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);margin:22px 0 10px;}
  h2.section-title:first-child{margin-top:0;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .op-btn{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .1s;}
  .op-btn:active{transform:scale(.97);}
  .op-btn .icon{font-size:22px;}
  .op-btn .lbl{font-size:13px;font-weight:600;line-height:1.25;}
  .op-btn.recette{border-left:4px solid var(--green);}
  .op-btn.depense{border-left:4px solid var(--amber);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .empty{color:var(--ink-dim);font-size:13px;padding:18px 4px;text-align:center;}

  .tx-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .tx-row:last-child{border-bottom:none;}
  .tx-row .ic{font-size:19px;width:30px;text-align:center;}
  .tx-row .mid{flex:1;min-width:0;}
  .tx-row .mid .l{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-row .mid .c{font-size:11.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-row .amt{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px;white-space:nowrap;}
  .amt.pos{color:var(--green);}
  .amt.neg{color:var(--red);}
  .amt.adj{color:var(--amber);}

  .toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
  select, input[type=text], input[type=number], input[type=date]{
    font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%;
  }
  select{width:auto;}
  .filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}

  table.report{width:100%;border-collapse:collapse;font-size:13px;}
  table.report td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  table.report td.v{text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  table.report td.num-col{width:44px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding-right:6px;}
  table.report tr.chapter-row td{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:1px;color:var(--navy);padding-top:16px;border-bottom:1px solid var(--navy);}
  table.report tr.chapter-row:first-child td{padding-top:2px;}
  table.report tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;padding-top:9px;}
  table.report tr.grandtotal td{font-weight:700;font-size:14.5px;border-top:2px solid var(--navy);border-bottom:2px solid var(--navy);padding:10px 0;}
  .result-banner{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:var(--radius);margin-top:14px;}
  .result-banner.pos{background:var(--green-dim);}
  .result-banner.neg{background:var(--red-dim);}
  .result-banner .lab{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-dim);}
  .result-banner .val{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;}
  .result-banner.pos .val{color:var(--green);}
  .result-banner.neg .val{color:var(--red);}

  .note{font-size:12px;color:var(--ink-dim);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.5;}
  .balance-check{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:14px;font-size:13px;font-weight:600;}
  .balance-check.ok{color:var(--green);}
  .balance-check.bad{color:var(--red);}

  label.field{display:block;font-size:12px;font-weight:600;color:var(--ink-dim);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px;}
  .btn{display:block;width:100%;text-align:center;padding:13px;border-radius:12px;border:none;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.5px;cursor:pointer;}
  .btn.primary{background:var(--navy);color:#fff;margin-top:18px;}
  .btn.ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);margin-top:8px;}
  .btn.danger{background:var(--red-dim);color:var(--red);margin-top:8px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;}

  .indic-sub{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-dim);font-weight:700;margin-bottom:8px;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
  .bar-label{width:auto;max-width:140px;flex-shrink:0;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:8px;background:var(--paper);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--navy);border-radius:6px;}
  .bar-val{min-width:60px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;flex-shrink:0;}

  .player-card{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .player-card:last-child{border-bottom:none;}
  .player-card .avatar{width:38px;height:38px;flex-shrink:0;border-radius:50%;background:var(--navy-dim);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:600;color:var(--navy);font-size:13px;}
  .player-card .pinfo{flex:1;min-width:0;}
  .player-card .pname{font-weight:600;font-size:13.5px;}
  .player-card .pmeta{font-size:11.5px;color:var(--ink-dim);}
  .status-badge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;letter-spacing:.3px;white-space:nowrap;}
  .status-badge.ok{background:var(--green-dim);color:var(--green);}
  .status-badge.warn{background:var(--amber-dim);color:var(--amber);}
  .status-badge.bad{background:var(--red-dim);color:var(--red);}

  .detail-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .back-btn{background:#fff;border:1px solid var(--line);border-radius:10px;width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}
  .detail-header h2{font-family:'Oswald',sans-serif;font-size:18px;margin:0;flex:1;}
  .info-rows{display:flex;flex-direction:column;gap:8px;}
  .info-rows .r{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);gap:8px;}
  .info-rows .r:last-child{border-bottom:none;}
  .info-rows .r span:first-child{color:var(--ink-dim);}

  .lic-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;gap:8px;}
  .lic-row:last-child{border-bottom:none;}
  .lic-row .lic-date{color:var(--ink-dim);flex-shrink:0;}
  .lic-row .lic-amts{font-family:'IBM Plex Mono',monospace;text-align:right;flex:1;}
  .lic-row .lic-del{border:none;background:none;color:var(--ink-dim);font-size:13px;cursor:pointer;flex-shrink:0;}

  .stock-row{padding:11px 0;border-bottom:1px solid var(--line);}
  .stock-row:last-child{border-bottom:none;}
  .stock-row .sr-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .stock-row .sr-name{font-weight:600;font-size:13px;}
  .stock-row .sr-meta{font-size:11.5px;color:var(--ink-dim);margin-top:3px;}
  .stock-row .sr-val{font-family:'IBM Plex Mono',monospace;font-size:13px;white-space:nowrap;}

  .part-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .part-row:last-child{border-bottom:none;}
  .part-row input[type=checkbox]{flex-shrink:0;width:auto;}
  .part-row .pname2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .part-row select{flex-shrink:0;}
  .occ-check{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px;}
  .occ-check input{width:auto;}

  .group-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;}
  .group-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .group-head .gt{font-weight:600;font-size:13px;}
  .group-head .gt small{color:var(--ink-dim);font-weight:400;}
  .group-body{padding:0 14px 10px;}

  .acc-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);}
  .acc-row:last-child{border-bottom:none;}
  .acc-row input{font-size:12.5px;padding:6px 8px;}
  .acc-row .acc-compte{width:64px;flex-shrink:0;}
  .acc-row .acc-lib{flex:1;min-width:0;}
  .acc-row button{flex-shrink:0;border:none;background:none;color:var(--ink-dim);font-size:13px;cursor:pointer;}
  .map-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .map-row:last-child{border-bottom:none;}
  .map-row .ml{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .map-row select{flex-shrink:0;max-width:150px;}

  #nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid var(--line);display:flex;padding:5px 1px 9px;z-index:20;}
  #nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0px;cursor:pointer;color:var(--ink-dim);font-size:8.4px;font-weight:600;letter-spacing:.1px;}
  #nav button .ic{font-size:15px;}
  #nav button.active{color:var(--navy);}

  #overlay{position:fixed;inset:0;z-index:50;display:none;}
  #overlay.open{display:block;}
  .backdrop{position:absolute;inset:0;background:rgba(20,20,20,.45);}
  .sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:460px;background:var(--paper);border-radius:20px 20px 0 0;padding:18px 18px 26px;max-height:88vh;overflow-y:auto;}
  .sheet h3{font-family:'Oswald',sans-serif;font-size:17px;margin:2px 0 2px;display:flex;align-items:center;gap:8px;}
  .sheet .cat-icon{font-size:20px;}
  .euro-input{position:relative;}
  .euro-input span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-dim);font-size:13px;}
  .euro-input input{padding-right:32px;}

  #toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:30px;font-size:13px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  #saving-indicator{position:fixed;top:12px;right:12px;background:rgba(22,35,63,.92);color:#fff;font-size:11px;padding:6px 11px;border-radius:20px;display:flex;align-items:center;gap:6px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:70;}
  #saving-indicator.show{opacity:1;}
  #saving-indicator .spin{width:10px;height:10px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>

<body>
<div id="shell">
  <div id="gate">
    <div class="gate-icon">📒</div>
    <h2 class="display">Comptes du club</h2>
    <p>Les données sont stockées sur Google Drive. Connectez-vous avec le compte Google qui a accès au dossier du club pour charger l'application.</p>
    <button class="btn primary" onclick="connectDrive()">🔐 Connecter Google Drive</button>
    <div class="gate-status" id="gate-status"></div>
    <div class="gate-version" style="font-size:11px;color:var(--ink-dim);margin-top:14px;">Version 1.6 — mise à jour des relevés et du bilan</div>
  </div>
  <div id="topbar"></div>
  <div id="app"></div>
  <div id="nav"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
  <div id="saving-indicator"><span class="spin"></span><span>Enregistrement…</span></div>
</div>

<script>
/* ============== GOOGLE DRIVE — CONFIGURATION ==============
   1) Sur https://console.cloud.google.com : créez un projet, activez "Google Drive API"
      (menu API et services > Bibliothèque).
   2) Configurez l'écran de consentement OAuth (type "Externe" convient pour un petit club ;
      en mode "Test" vous ajoutez les emails des membres autorisés, aucune validation Google requise).
   3) Créez un identifiant OAuth "ID client OAuth" de type "Application Web" :
      - Origines JavaScript autorisées : l'URL exacte où cette page sera hébergée
        (ex : https://votre-compte.github.io)
      - Aucune URI de redirection n'est nécessaire (flux à jeton implicite).
   4) Collez le Client ID obtenu ci-dessous.
   5) Pour que plusieurs comptes Google partagent les mêmes données : un seul compte se connecte
      en premier (il crée le dossier "Comptabilite-Club" dans SON Drive), puis ce compte partage
      ce dossier (clic droit > Partager, rôle "Éditeur") avec l'adresse Gmail de chaque autre
      membre, AVANT que ces membres ne cliquent "Connecter Google Drive". */
const GOOGLE_CLIENT_ID = '796240683229-l60espkuiio4mg2r4d1srkd7retp9p4a.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive';
const DRIVE_FOLDER_NAME = 'Comptabilite-Club';
const DRIVE_FILE_NAME = 'club-comptabilite-data.json';

let gTokenClient = null;
let gAccessToken = null;
let gTokenExpiresAt = 0;
let driveFolderId = null;
let driveFileId = null;

function setGateStatus(msg, isError){
  const el = document.getElementById('gate-status');
  if(el){ el.textContent = msg||''; el.className = 'gate-status'+(isError?' gate-error':''); }
}

function initGoogleAuth(){
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
    setGateStatus("Impossible de charger l'authentification Google (vérifiez votre connexion).", true);
    return;
  }
  if(GOOGLE_CLIENT_ID.indexOf('REMPLACER_PAR_VOTRE_CLIENT_ID')===0){
    setGateStatus("Client ID Google non configuré — voir les commentaires en haut du fichier.", true);
    return;
  }
  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: ()=>{},
    error_callback: (err)=>{ if(gTokenErrCb) gTokenErrCb(err); }
  });
}
let gTokenErrCb = null;
const TOKEN_STORE_KEY = 'club_gtoken_v1';
function saveTokenLocally_(){
  try{ localStorage.setItem(TOKEN_STORE_KEY, JSON.stringify({ t:gAccessToken, e:gTokenExpiresAt, ok:true })); }catch(e){}
}
function loadSavedToken_(){
  try{ return JSON.parse(localStorage.getItem(TOKEN_STORE_KEY)||'null'); }catch(e){ return null; }
}
/* Reconnexion automatique au rechargement : jeton encore valide, sinon renouvellement silencieux */
async function autoReconnect_(){
  const saved = loadSavedToken_();
  if(!saved || !saved.ok) return;
  setGateStatus('Reconnexion…');
  try{
    if(saved.t && Date.now() < saved.e){
      gAccessToken = saved.t; gTokenExpiresAt = saved.e;
    } else {
      await Promise.race([ requestDriveToken(false), new Promise((_,rej)=>setTimeout(()=>rej(new Error('délai dépassé')),8000)) ]);
    }
    setGateStatus('Chargement des données…');
    await loadData();
  }catch(e){
    console.warn('Reconnexion automatique impossible', e);
    setGateStatus('Session expirée — cliquez sur « Connecter Google Drive ».');
  }
}
window.addEventListener('load', ()=>{ initGoogleAuth(); setTimeout(autoReconnect_, 300); });
window.addEventListener('load', ()=>{
  if(typeof pdfjsLib !== 'undefined'){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }
});

function requestDriveToken(interactive){
  return new Promise((resolve, reject)=>{
    if(!gTokenClient){ reject(new Error("Google Identity Services n'est pas prêt")); return; }
    gTokenErrCb = (err)=>reject(new Error((err && (err.type||err.message)) || 'Autorisation interrompue'));
    gTokenClient.callback = (resp)=>{
      if(resp && resp.access_token){
        gAccessToken = resp.access_token;
        gTokenExpiresAt = Date.now() + ((resp.expires_in||3600)*1000) - 60000;
        saveTokenLocally_();
        resolve(gAccessToken);
      } else {
        reject(new Error((resp && resp.error) || 'Autorisation refusée'));
      }
    };
    gTokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
  });
}
async function ensureDriveToken(){
  if(gAccessToken && Date.now() < gTokenExpiresAt) return gAccessToken;
  try{ return await requestDriveToken(false); }
  catch(e){ return await requestDriveToken(true); }
}
async function driveFetch(url, options){
  const token = await ensureDriveToken();
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer '+token });
  const res = await fetch(url, options);
  if(!res.ok){
    const text = await res.text().catch(()=>'');
    throw new Error('Drive API '+res.status+': '+text);
  }
  return res;
}
async function findOrCreateDriveFolder(){
  if(driveFolderId) return driveFolderId;
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
  const json = await res.json();
  if(json.files && json.files.length>0){ driveFolderId = json.files[0].id; return driveFolderId; }
  const createRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' })
  });
  const created = await createRes.json();
  driveFolderId = created.id;
  return driveFolderId;
}
async function findOrCreateDriveFile(){
  const folderId = await findOrCreateDriveFolder();
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME.replace(/'/g,"\\'")}' and '${folderId}' in parents and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
  const json = await res.json();
  if(json.files && json.files.length>0){ driveFileId = json.files[0].id; return driveFileId; }
  const metadata = { name: DRIVE_FILE_NAME, parents:[folderId], mimeType:'application/json' };
  const boundary = '-------clubcompta'+Date.now();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(data)}\r\n`+
    `--${boundary}--`;
  const createRes = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST', headers:{'Content-Type': `multipart/related; boundary=${boundary}`}, body
  });
  const created = await createRes.json();
  driveFileId = created.id;
  return driveFileId;
}
async function findOrCreateDriveSubfolder(name){
  const parent = await findOrCreateDriveFolder();
  const q = encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and '${parent}' in parents and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
  const json = await res.json();
  if(json.files && json.files.length>0) return json.files[0].id;
  const createRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, mimeType:'application/vnd.google-apps.folder', parents:[parent] })
  });
  const created = await createRes.json();
  return created.id;
}
async function driveUploadFile(file, folderId, customName){
  const metadata = { name: customName || file.name, parents:[folderId], mimeType: file.type || 'application/octet-stream' };
  const boundary = '-------clubcomptafile'+Date.now()+Math.random().toString(36).slice(2,8);
  const delimiter = `\r\n--${boundary}\r\n`;
  const closeDelim = `\r\n--${boundary}--`;
  const metaPart = delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata);
  const filePartHeader = delimiter + `Content-Type: ${metadata.mimeType}\r\n\r\n`;
  const body = new Blob([metaPart, filePartHeader, file, closeDelim]);
  const token = await ensureDriveToken();
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+token, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  if(!res.ok){ const t=await res.text().catch(()=>''); throw new Error('Upload Drive échoué '+res.status+': '+t); }
  return res.json(); // {id, name, webViewLink}
}

function treasuryAt(cutoffDate, compteFilter){
  let bal = 0;
  if(compteFilter) bal += soldeOuvertureFor(compteFilter);
  else TRESO_COMPTES.forEach(c=>{ bal += soldeOuvertureFor(c); });
  data.transactions.forEach(t=>{
    if(t.regle===false) return;
    if(compteFilter && (t.tresoCompte||'5121')!==compteFilter) return;
    const cashDate = t.dateReglement || t.date;
    if(cashDate<=cutoffDate) bal += (t.type==='recette'? t.amount : -t.amount);
  });
  return bal;
}
function tiersDetailAt(cutoffDate){
  // Compensation par TIERS NOMMÉ (compte + personne), pas globalement par compte :
  // deux personnes sur le même compte (ex. 4672) ne doivent jamais se compenser entre elles.
  const net = {};
  Object.keys(data.settings.soldesOuverture||{}).forEach(c=>{
    if(!TRESO_COMPTES.includes(c) && c!=='218' && c!=='110' && soldeOuvertureFor(c)!==0){
      const key = c+'|__ouverture__';
      net[key] = { compte:c, nom:"Solde d'ouverture (non affecté)", montant: soldeOuvertureFor(c) };
    }
  });
  data.transactions.forEach(t=>{
    if(t.date>cutoffDate) return;
    if(t.tiersType){
      // L'écriture d'origine ne change JAMAIS (son historique reste intact) : si elle a une
      // contrepassation (nouveau système), c'est celle-ci (traitée dans la branche "sinon"
      // ci-dessous, à sa propre date) qui viendra la compenser le moment venu — jamais une
      // exclusion rétroactive ici. Seuls les anciens règlements enregistrés EN PLACE (avant
      // l'ajout de la contrepassation, sans écriture séparée) doivent encore être exclus une
      // fois réglés, et seulement s'ils l'étaient déjà à la date d'arrêté du bilan : un
      // règlement intervenant après le cutoff (ex. en N pour un bilan arrêté au 31/08/N) ne doit
      // jamais modifier un bilan déjà arrêté.
      if(!t.reglementTxId && t.regle!==false){
        const settledDate = t.dateReglement || t.date;
        if(settledDate<=cutoffDate) return;
      }
      const c = tiersCompteOf(t);
      const nom = t.tiersNom || 'Non précisé';
      const key = c+'|'+nom;
      if(!net[key]) net[key] = { compte:c, nom, montant:0 };
      net[key].montant += (t.type==='recette' ? t.amount : -t.amount);
    }else{
      // écriture passée directement sur un compte de tiers (classe 4) : soit une contrepassation
      // de règlement (rattachée au même tiers nommé pour se compenser avec sa dette d'origine),
      // soit une écriture libre sans mécanisme "tiers non soldé". Ce n'est jamais une charge/produit,
      // juste un mouvement de bilan. Le sens est inversé par rapport au cas ci-dessus car ici le type
      // décrit le sens de la trésorerie (payé/encaissé), pas la nature économique d'une charge en attente.
      const c = accountForTx(t);
      if(!/^4/.test(c)) return;
      const nom = t.tiersNom || null;
      const key = c+'|'+(nom || '__direct__');
      if(!net[key]) net[key] = { compte:c, nom: nom || libelleForCompte(c), montant:0 };
      net[key].montant += (t.type==='recette' ? -t.amount : t.amount);
    }
  });
  return Object.values(net);
}
function immoAt(cutoffDate){
  let v = soldeOuvertureFor('218');
  data.transactions.forEach(t=>{ if(t.date<=cutoffDate && t.type==='depense' && t.immo) v += t.amount; });
  return v;
}
function resultForYear(year){
  let produits=0, charges=0;
  const prodByCompte={}, chgByCompte={};
  let immoAchats=0;
  data.transactions.filter(t=>exerciceForDate(t.date)===year).forEach(t=>{
    const compte = accountForTx(t);
    if(/^4/.test(compte)) return; // compte de tiers (classe 4) : mouvement de bilan, pas de résultat
    if(t.type==='recette'){ produits+=t.amount; prodByCompte[compte]=(prodByCompte[compte]||0)+t.amount; }
    else if(t.immo){ immoAchats += t.amount; }
    else { charges+=t.amount; chgByCompte[compte]=(chgByCompte[compte]||0)+t.amount; }
  });
  return { produits, charges, resultat: produits-charges, prodByCompte, chgByCompte, immoAchats };
}
function resultBeforeYear(year){
  let produits=0, charges=0;
  data.transactions.filter(t=>exerciceForDate(t.date)<year).forEach(t=>{
    const compte = accountForTx(t);
    if(/^4/.test(compte)) return;
    if(t.type==='recette') produits+=t.amount; else if(!t.immo) charges+=t.amount;
  });
  return produits-charges;
}
function cutoffForYear(year){
  const currentEx = exerciceForDate(todayStr());
  return year>=currentEx ? todayStr() : `${year+1}-08-31`;
}
function ageFromBirth(dateStr){
  if(!dateStr) return null;
  const b=new Date(dateStr+'T00:00:00'), t=new Date();
  let age=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) age--;
  return age;
}
function playerNameFor(id){
  const p = data.players.find(p=>p.id===id);
  return p ? `${p.prenom} ${p.nom}` : '';
}
function licenseStatus(p){
  if(!p.licenses.length) return {label:'Aucune licence', cls:'bad'};
  const last = [...p.licenses].sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0];
  const days = (new Date(todayStr()) - new Date(last.date))/86400000;
  if(days<=365) return {label:'À jour', cls:'ok'};
  return {label:'À renouveler', cls:'warn'};
}
function moisLabel(m){ return ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'][m]; }
function monthlyTreasurySeries(year){
  const pad = n=>String(n).padStart(2,'0');
  const points = [];
  points.push({label:'Août '+String(year).slice(2), value: treasuryAt(`${year}-08-31`)});
  const todayD = new Date();
  for(let i=0;i<12;i++){
    let m = 9+i, yy = year;
    if(m>12){ m-=12; yy=year+1; }
    const lastDay = new Date(yy, m, 0).getDate();
    const monthEndDate = new Date(yy, m-1, lastDay);
    if(monthEndDate > todayD) break;
    let cutoff = `${yy}-${pad(m)}-${pad(lastDay)}`;
    if(cutoff > todayStr()) cutoff = todayStr();
    points.push({label: moisLabel(m-1), value: treasuryAt(cutoff)});
  }
  return points;
}

/* ============== TOAST ============== */
let toastTimer=null;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ============== double-tap confirm générique ============== */
let armedDeletes = new Set();
function confirmAction(key, el, normalLabel, cb){
  if(!armedDeletes.has(key)){
    armedDeletes.add(key);
    if(el) el.textContent = 'Confirmer ?';
    setTimeout(()=>{ armedDeletes.delete(key); if(el && document.body.contains(el)) el.textContent=normalLabel; }, 3000);
    return;
  }
  armedDeletes.delete(key);
  cb();
}

/* ============== ÉTAT DE FRAIS (justificatif de règlement pour la compta) ============== */
function adherentOf_(t){ return t.tiersPlayerId || t.playerId || null; }
function efEligible_(t){ return !!t && t.type==='depense' && t.amount>0 && !!adherentOf_(t); }
function efRecetteEligible_(t){ return !!t && t.type==='recette' && t.amount>0 && !!adherentOf_(t); }
function efLineEligible_(t){ return efEligible_(t) || efRecetteEligible_(t); }
function efSigned_(t){ return t.type==='recette' ? -t.amount : t.amount; }
function efButton_(t){
  return efEligible_(t) ? `<button type='button' class='btn ghost' style='width:auto;margin:6px 0 0;padding:3px 10px;font-size:11px;' onclick="event.stopPropagation();openExpenseReport('${t.id}')">📄 État de frais</button>` : '';
}
function efContext_(t){
  const parts = [];
  if(t.tripId){ const tr = data.trips.find(x=>x.id===t.tripId); if(tr) parts.push('Déplacement : '+tr.nom+' ('+formatDateShort(tr.date)+')'); }
  if(t.eventId){ const ev = (data.events||[]).find(x=>x.id===t.eventId); if(ev) parts.push('Événement : '+ev.nom); }
  return parts.join(' · ');
}

}
function openExpenseReport(txId){
  const t = data.transactions.find(x=>x.id===txId);
  if(!t) return;
  if(!efEligible_(t)){ showToast("Choisissez d'abord l'adhérent (tiers) sur cette dépense, puis enregistrez"); return; }
  const pid = adherentOf_(t);
  const related = data.transactions.filter(x=>x.id!==t.id && efLineEligible_(x) && adherentOf_(x)===pid && !isReglee_(x) && ((t.tripId && x.tripId===t.tripId) || (t.eventId && x.eventId===t.eventId)));
  if(!t.efNum){
    data.settings.efCounter = (data.settings.efCounter||0)+1;
    t.efNum = 'EF-'+new Date().getFullYear()+'-'+String(data.settings.efCounter).padStart(3,'0');
    saveData();
  }
  ui.ef = { txId:t.id, playerId:pid, num:t.efNum, ids:[t.id, ...related.map(x=>x.id)], date:todayStr(), mode:'Virement' };
  renderExpenseReport_();
}

   laquelle rattacher chaque écriture, par défaut, d'après sa catégorie — l'utilisateur peut
   toujours déplacer une ligne vers une autre section au moment de l'édition. */
function efDefaultSection_(t){
  if(t.category==='deplacement_vehicules' || t.category==='deplacement_prise_charge') return 'transport';
  if(t.category==='materiel') return 'materiel';
  const alimCats = ['deplacement_general','repas_evenement','evenementrepas_depense_TDV','evenementrepas_depense_Noel','evenementrepas_depense_Aligot','achat_matieres_tdv','achat_matieres_noel','achat_matieres_bedons'];
  if(alimCats.includes(t.category)) return 'alimentaire';
  const c = (t.comment||'').toLowerCase();
  if(/h[oô]tel|airbnb|h[ée]bergement|g[iî]te|camping/.test(c)) return 'hebergement';
  return 'autre';
}
function efSectionOf_(t){ return (ui.ef && ui.ef.sections && ui.ef.sections[t.id]) || efDefaultSection_(t); }

const DEFAULT_EVENT_LINKS_ = [ { nom:'TDV', comptes:['6011','7011','7061'] }, { nom:'Noël', comptes:['6012','7012'] }, { nom:'Aligot', comptes:['6013','7013'] } ];
function eventLinks_(){
  if(!data.settings.eventLinks) data.settings.eventLinks = JSON.parse(JSON.stringify(DEFAULT_EVENT_LINKS_));
  return data.settings.eventLinks;
}
/* Retrouve l'événement de l'année lié à ce compte, ou le crée s'il n'existe pas encore (1 par année) */
function findOrCreateLinkedEvent_(compte, dateIso){
  const link = eventLinks_().find(l=>l.comptes.includes(compte));
  if(!link || !dateIso) return null;
  const y = dateIso.slice(0,4), nk = normKey_(link.nom);
  if(!data.events) data.events = [];
  let ev = data.events.find(e=>e.date && e.date.slice(0,4)===y && (e.linkKey===link.nom || normKey_(e.nom).includes(nk)));
  let created = false;
  if(!ev){ ev = { id: uid('evt'), nom: link.nom+' '+y, date: dateIso, linkKey: link.nom }; data.events.push(ev); created = true; }
  return { ev, created };
}
async function setEventLinkComptes(i, val){
  const link = eventLinks_()[i]; if(!link) return;
  link.comptes = String(val).split(/[,; ]+/).map(s=>s.trim()).filter(Boolean);
  await saveData(); showToast('Comptes liés mis à jour');
}
async function attachExistingToEvents(){
  let n = 0, created = 0;
  data.transactions.forEach(t=>{
    if(t.eventId || t.tripId) return;
    const r = findOrCreateLinkedEvent_(accountForTx(t), t.date);
    if(r){ t.eventId = r.ev.id; n++; if(r.created) created++; }
  });
  await saveData();
  showToast(n ? `${n} opération(s) rattachée(s)${created?`, ${created} événement(s) créé(s)`:''}` : 'Rien à rattacher');
  renderAll();
}
let quickScanPending = null; // {amount, date, piece} — en attente du choix de catégorie
async function handleQuickScan(event, eventId){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const statusEl = document.getElementById('quick-scan-status');
  const btnEl = document.getElementById('quick-scan-btn');
  if(typeof Tesseract === 'undefined'){
    if(statusEl){ statusEl.style.display='block'; statusEl.textContent = "La lecture automatique n'a pas pu se charger (connexion internet nécessaire la première fois)."; }
    return;
  }
  if(btnEl) btnEl.disabled = true;
  if(statusEl){ statusEl.style.display='block'; statusEl.textContent = 'Lecture du justificatif en cours… (quelques secondes)'; }
  try{
    const images = await fileToOcrImages(file, 3);
    let text = '';
    for(let i=0;i<images.length;i++){
      const result = await Tesseract.recognize(images[i], 'fra', {
        logger: m=>{
          if(m.status==='recognizing text' && statusEl){
            statusEl.textContent = 'Lecture en cours… '+Math.round((m.progress||0)*100)+'%'+(images.length>1?` (page ${i+1}/${images.length})`:'');
          }
        }
      });
      text += '\n' + ((result && result.data && result.data.text) || '');
    }
    const parsed = parseReceiptText_(text);
    parsed.cat = guessCategory_(text, null);
    let piece = null;
    if(statusEl) statusEl.textContent = 'Envoi du justificatif sur Drive…';
    try{
      const folderId = await findOrCreateDriveSubfolder('Justificatifs');
      const uploaded = await driveUploadFile(file, folderId, `${todayStr()}_${file.name}`);
      piece = { id: uploaded.id, name: uploaded.name, link: driveFileViewLink(uploaded.id) };
    }catch(upErr){ console.error('Erreur upload Drive', upErr); }
    if(statusEl){ statusEl.style.display='none'; statusEl.textContent=''; }
    openQuickScanCategoryPicker_(parsed, piece, eventId);
  }catch(e){
    console.error('Erreur OCR', e);
    if(statusEl) statusEl.textContent = 'Erreur pendant la lecture du justificatif — réessayez.';
  }finally{
    if(btnEl) btnEl.disabled = false;
  }
}

  const q = (qRaw||'').trim().toLowerCase();
  if(!q) return true;
  const cat = CATEGORIES[t.category] || {label:t.category};
  const fields = [accountForTx(t), cat.label, t.comment, t.tiersNom, playerNameFor(t.playerId)].filter(Boolean).join(' ').toLowerCase();
  if(fields.includes(q)) return true;
  const amountStr = Math.abs(t.amount||0).toFixed(2).replace('.', ',');
  if(amountStr.includes(q.replace('.', ','))) return true;
  return false;
}

function renderBilan(){
  const years = yearsAvailable();
  const cutoff = cutoffForYear(ui.year);

  const tresoLivretA = treasuryAt(cutoff,'5122');
  const tresoCaisse = treasuryAt(cutoff,'530');
  const treso = tresoBanque + tresoLivretA + tresoCaisse;
  const immo = immoAt(cutoff);
  const tiersEntries = tiersDetailAt(cutoff).filter(e=>Math.abs(e.montant)>=0.005)
    .sort((a,b)=> a.compte.localeCompare(b.compte, undefined, {numeric:true}) || a.nom.localeCompare(b.nom));
  const tiersActif = tiersEntries.filter(e=>e.montant>0);
  const tiersPassif = tiersEntries.filter(e=>e.montant<0);
  const totalTiersActif = tiersActif.reduce((a,e)=>a+e.montant,0);
  const totalTiersPassif = tiersPassif.reduce((a,e)=>a-e.montant,0);
  const totalActif = treso + immo + totalTiersActif;

  const fondsInitiaux = soldeOuvertureFor('110');
  const reportAnterieur = fondsInitiaux + resultBeforeYear(ui.year);
  const resultatExercice = resultForYear(ui.year).resultat;
  const totalPassif = reportAnterieur + resultatExercice + totalTiersPassif;
  const equilibre = Math.abs(totalActif-totalPassif) < 0.01;

  const serie = monthlyTreasurySeries(ui.year);
  const minPoint = serie.reduce((a,b)=> b.value<a.value? b:a, serie[0]);
  const chartSvg = buildTresorerieChart(serie);

  document.getElementById('app').innerHTML = `
    <div class="filters">
      <select onchange="ui.year=Number(this.value);renderAll()">
        ${years.map(y=>`<option value="${y}" ${y===ui.year?'selected':''}>${exerciceLabel(y)} — au ${y===exerciceForDate(todayStr())?"aujourd'hui":'31/08/'+(y+1)}</option>`).join('')}
      </select>
      <button class="btn ghost" style="margin:0;width:auto;" onclick="openEtatTiers()">📋 État des tiers (401 / 411 / 4672)</button>
    </div>

    <h2 class="section-title">Bilan</h2>
    <div class="card">
      <table class="report">
        ${chapterRow('Actif — Classe 2, 4 & 5')}
        ${accountRow(COMPTE_IMMO.compte, immo, ui.year)}
        ${tiersActif.map(e=>tiersRow(e)).join('')}
        ${accountRow(COMPTE_BANQUE.compte, tresoBanque, ui.year)}
        ${accountRow(COMPTE_LIVRETA.compte, tresoLivretA, ui.year)}
        ${accountRow(COMPTE_CAISSE.compte, tresoCaisse, ui.year)}
        <tr class="grandtotal"><td colspan="2">Total actif</td><td class="v">${euro(totalActif)}</td></tr>
        ${chapterRow('Passif — Classe 1 & 4')}
        ${accountRow(COMPTE_FONDS.compte, reportAnterieur, ui.year)}
        ${accountRow(COMPTE_RESULTAT.compte, resultatExercice, ui.year)}
        ${tiersPassif.map(e=>tiersRow(e)).join('')}
        <tr class="grandtotal"><td colspan="2">Total passif</td><td class="v">${euro(totalPassif)}</td></tr>
      </table>
      ${(tiersEntries.length>0) ? `<div class="note">Chaque tiers (401/4671/4672) est compensé individuellement : une même personne ne se mélange jamais avec une autre sur le même compte. Cliquez sur un nom pour voir son historique.</div>` : ''}
    </div>

    <div class="balance-check ${equilibre?'ok':'bad'}">
      ${equilibre ? '✓ Le bilan est équilibré' : '⚠ Écart détecté, vérifiez les réglages'}
    </div>

    <h2 class="section-title">Évolution de la trésorerie — ${exerciceLabel(ui.year)}</h2>
    <div class="card">
      ${chartSvg}
      <div class="note">Creux de trésorerie observé : <b>${euro(minPoint.value)}</b> (${minPoint.label}). Ordre de grandeur du besoin de trésorerie à couvrir sur la période (indicateur simplifié, pas un calcul de BFR normé).</div>
    </div>

    <div class="note">Bilan simplifié pour petite association (comptabilité de trésorerie + tiers) : le matériel est affiché à sa valeur brute d'achat, sans amortissement.</div>
  `;
}
function buildTresorerieChart(points){
  const values = points.map(p=>p.value);
  const minV = Math.min(0, ...values);
  const maxV = Math.max(0, ...values);
  const range = (maxV-minV) || 1;
  const w=400, h=150, padL=6, padR=6, padT=10, padB=20;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const stepX = plotW/((points.length-1)||1);
  const xy = points.map((p,i)=>{
    const x = padL + i*stepX;
    const y = padT + plotH - ((p.value-minV)/range)*plotH;
    return {x,y,label:p.label,value:p.value};
  });
  const zeroY = padT + plotH - ((0-minV)/range)*plotH;
  const pathD = xy.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  let minIdx=0; xy.forEach((p,i)=>{ if(p.value<xy[minIdx].value) minIdx=i; });
  const dots = xy.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i===minIdx?4:2.3}" fill="${i===minIdx?'#B23A22':'#16233F'}"/>`).join('');
  const labels = xy.map(p=>`<text x="${p.x.toFixed(1)}" y="${h-4}" font-size="8" text-anchor="middle" fill="#726C5C">${p.label}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="#E2DCC9" stroke-width="1"/>
    <path d="${pathD}" fill="none" stroke="#16233F" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}

function ageBucketsList(){
  return [
    {label:'< 6 ans', min:-1, max:5},
    {label:'6-8 ans', min:6, max:8},
    {label:'9-10 ans', min:9, max:10},
    {label:'11-12 ans', min:11, max:12},
    {label:'13-15 ans', min:13, max:15},
    {label:'16-17 ans', min:16, max:17},
    {label:'Open (18-29 ans)', min:18, max:29},
    {label:'Sénior +30 (30-34 ans)', min:30, max:34},
    {label:'Sénior +35 (35-39 ans)', min:35, max:39},
    {label:'Master +40 (40-99 ans)', min:40, max:99},
  ];
}
function bucketFor(age){
  if(age===null || age===undefined) return null;
  const buckets = ageBucketsList();
  for(const b of buckets){ if(age>=b.min && age<=b.max) return b.label; }
  return 'Master +40 (40-99 ans)';
}
function barRow(label,n,total){
  const pct = total? Math.round(n/total*100):0;
  return `<div class="bar-row"><span class="bar-label">${escapeHtml(label)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-val">${n} (${pct}%)</span></div>`;
}
function renderIndicateurs(){
  const total = data.players.length;
  if(total===0) return '';
  const genders = {};
  data.players.forEach(p=>{ genders[p.gender]=(genders[p.gender]||0)+1; });
  const genderBars = Object.entries(genders).map(([g,n])=>barRow(g, n, total)).join('');

  const order = ageBucketsList().map(b=>b.label);
  const counts = {};
  data.players.forEach(p=>{ const b=bucketFor(ageFromBirth(p.birthDate)); if(b) counts[b]=(counts[b]||0)+1; });
  const ageBars = order.filter(l=>counts[l]).map(l=>barRow(l, counts[l], total)).join('');

  return `
    <h2 class="section-title">Indicateurs</h2>
    <div class="card">
      <div class="indic-sub">Répartition par genre</div>
      ${genderBars}
      <div class="indic-sub" style="margin-top:12px;">Répartition par catégorie d'âge</div>
      ${ageBars}
    </div>`;
}

async function submitTeamForm(){
  const nom = document.getElementById('team-nom').value.trim();
  const type = document.getElementById('team-type').value;
  if(!nom){ showToast('Indiquez un nom'); return; }
  let team;
  if(ui.editTeamId){
    team = data.teams.find(t=>t.id===ui.editTeamId);
    team.nom=nom; team.type=type;
  } else {
    team = { id: uid('team'), nom, type };
    data.teams.push(team);
  }
  const checkedIds = new Set(Array.from(document.querySelectorAll('.tf-player:checked')).map(el=>el.value));
  data.players.forEach(p=>{
    if(!p.teamIds) p.teamIds=[];
    const has = p.teamIds.includes(team.id);
    if(checkedIds.has(p.id) && !has) p.teamIds.push(team.id);
    else if(!checkedIds.has(p.id) && has) p.teamIds = p.teamIds.filter(id=>id!==team.id);
  });
  await saveData();
  closeForm();
  showToast('Équipe enregistrée ✓');
  renderAll();
}
async function deleteTeam(id){
  data.players.forEach(p=>{ if(p.teamIds) p.teamIds = p.teamIds.filter(tid=>tid!==id); });
  data.teams = data.teams.filter(t=>t.id!==id);
  await saveData();
  closeForm();
  showToast('Équipe supprimée');
  renderAll();
}

/* ============== DEPLACEMENTS : CALCUL ============== */
function participantName(p){ return p.playerId ? (playerNameFor(p.playerId)||p.nom) : p.nom; }
function tripCalc(trip){
  const participants = trip.participants;
  const nTotal = participants.length;
  const nJoueurs = participants.filter(p=>p.role==='joueur').length;
  const nCoachs = participants.filter(p=>p.role==='coach').length;
  const nAccomp = participants.filter(p=>p.role==='accompagnateur').length;
  const nRepasTournoi = nJoueurs + nAccomp;
  const transportTotal = trip.vehicles.reduce((s,v)=>s+(Number(v.carburant)||0)+(Number(v.peages)||0)+(Number(v.stationnement)||0),0);
  const transportShare = nTotal>0 ? transportTotal/nTotal : 0;
  const hebergementShare = nTotal>0 ? (Number(trip.couts.hebergement)||0)/nTotal : 0;
  const repasShare = nRepasTournoi>0 ? (Number(trip.couts.repas)||0)/nRepasTournoi : 0;
  const tournoiShare = nRepasTournoi>0 ? (Number(trip.couts.tournoi)||0)/nRepasTournoi : 0;
  const subventionParJoueur = Number(trip.priseEnChargeClub)||0;

  const montants = {};
  participants.forEach(p=>{
    let m;
    if(p.role==='coach') m = transportShare+hebergementShare;
    else if(p.role==='accompagnateur') m = transportShare+hebergementShare+repasShare+tournoiShare;
    else m = Math.max(0, transportShare+hebergementShare+repasShare+tournoiShare - subventionParJoueur);
    montants[p.id] = m;
  });

  const totalCosts = transportTotal + (Number(trip.couts.hebergement)||0) + (Number(trip.couts.repas)||0) + (Number(trip.couts.tournoi)||0);
  const totalCollectePrevu = Object.values(montants).reduce((a,b)=>a+b,0);
  const totalCollecteRecu = participants.filter(p=>p.paiementRecu).reduce((s,p)=>s+(montants[p.id]||0),0);

  return { nTotal, nJoueurs, nCoachs, nAccomp, nRepasTournoi, transportTotal, transportShare, hebergementShare, repasShare, tournoiShare, subventionParJoueur, montants, totalCosts, totalCollectePrevu, totalCollecteRecu };
}

const VEH_FIELD_LABEL_ = { carburant:'Carburant', peages:'Péages', stationnement:'Stationnement / autre' };
function classifyVehicleReceipt_(text){
  const t = (text||'').toLowerCase();
  const count = res => res.reduce((n,re)=>n+(re.test(t)?1:0),0);
  const fuel = count([/carburant/,/gazole|diesel|gasoil/,/sp ?9[58]|\be ?10\b|e85|\bgpl\b/,/sans plomb|essence/,/litres?\b|€ ?\/ ?l\b|\bvol\b/,/pompe|station[- ]service/,/total ?energies|esso|shell|\bavia\b|\bbp\b/]);

  if(fuel>0 && fuel>=toll) return 'carburant';
  if(toll>0) return 'peages';
  return 'stationnement';
}

function classifyTripReceipt_(text){
  const t = (text||'').toLowerCase();
  const count = res => res.reduce((n,re)=>n+(re.test(t)?1:0),0);
  const heb = count([/h[ôo]tel|h[ée]bergement|airbnb|booking|g[iî]te|auberge|camping/,/chambre|nuit[ée]e|taxe de s[ée]jour/,/ibis|campanile|kyriad|premi[èe]re classe|formule 1|b&b/]);

  const tou = count([/tournoi|comp[ée]tition/,/inscription|engagement|licence/,/f[ée]d[ée]ration|ligue|comit[ée]|ffbad/]);

      const amt = Number(v[f])||0;
      if(amt>0){
        const tx = { id: uid('tx'), type:'depense', category:'deplacement_vehicules', amount:amt, date:trip.date, comment:`${label} — véhicule ${v.conducteur||''} (${trip.nom})`, tripId:trip.id, vehicleId:v.id, playerId: v.conducteurPlayerId||undefined, natureDeplacement:nature, regle:false, tiersType:'fournisseur', tiersNom, tiersPlayerId: v.conducteurPlayerId||undefined, compteTiers: v.conducteurPlayerId ? '4672' : '401' };
        const piece = v.justificatifs && v.justificatifs[f];
        if(piece){ tx.pieceJointeId = piece.id; tx.pieceJointeNom = piece.name; }
        data.transactions.push(tx);
        v.txIds.push(tx.id);
      }
    });
  });

  trip.coutsGenerauxTxIds = [];
  const gfields = [['tournoi','tournoi','Tournoi'],['repas','repas','Repas'],['hebergement','hebergement','Hébergement']];
  gfields.forEach(([f,nature,label])=>{
    const amt = Number(trip.couts[f])||0;
    if(amt>0){
      const tx = { id: uid('tx'), type:'depense', category:'deplacement_general', amount:amt, date:trip.date, comment:`${label} — ${trip.nom}`, tripId:trip.id, natureDeplacement:nature, regle:false, tiersType:'fournisseur', tiersNom: trip.nom, compteTiers:'401' };
      data.transactions.push(tx);
      trip.coutsGenerauxTxIds.push(tx.id);
    }
  });

  trip.participants.forEach(p=>{
    const montant = Math.round((calc.montants[p.id]||0)*100)/100;
    if(montant>0){
      const tx = { id: uid('tx'), type:'recette', category:'deplacement_participation', amount: montant, date: trip.date, comment: `Participation déplacement — ${participantName(p)} (${trip.nom})`, playerId: p.playerId||undefined, tripId: trip.id, regle:false, tiersType:'client', tiersNom: participantName(p), tiersPlayerId: p.playerId||undefined, compteTiers: p.playerId ? '4672' : '401' };
      data.transactions.push(tx);
      p.txId = tx.id;
    }
  });

  trip.finalized = true;
  await saveData();
  showToast('Déplacement finalisé — écritures fournisseurs/clients créées ✓');
  renderAll();
}
async function deleteTrip(tripId){
  const trip = data.trips.find(t=>t.id===tripId);
  if(trip){
    const txIds = new Set();
    trip.vehicles.forEach(v=>{ (v.txIds||[]).forEach(id=>txIds.add(id)); (v.remboursementTxIds||[]).forEach(id=>txIds.add(id)); });
    trip.participants.forEach(p=>{ if(p.txId) txIds.add(p.txId); (p.subventionTxIds||[]).forEach(id=>txIds.add(id)); });
    (trip.coutsGenerauxTxIds||[]).forEach(id=>txIds.add(id));
    data.transactions = data.transactions.filter(t=>!txIds.has(t.id));
  }
  data.trips = data.trips.filter(t=>t.id!==tripId);
  await saveData();
  ui.selectedTripId = null;
  showToast('Déplacement supprimé');
  renderAll();
}

function renderEtatDeplacements(){
  const years = yearsAvailable();
  const natures = [
    ['carburant','Carburant'],['peages','Péages'],['stationnement','Stationnement'],
    ['tournoi','Tournoi'],['repas','Repas'],['hebergement','Hébergement']
  ];
  const txYear = data.transactions.filter(t=>t.tripId && exerciceForDate(t.date)===ui.year);
  const totals = {};
  natures.forEach(([n])=>totals[n]=0);
  let priseCharge = 0;
  txYear.forEach(t=>{
    if(t.natureDeplacement && totals.hasOwnProperty(t.natureDeplacement)) totals[t.natureDeplacement]+=t.amount;
    if(t.natureDeplacement==='prise_charge') priseCharge += t.amount;
  });
  const totalGeneral = natures.reduce((s,[n])=>s+totals[n],0);
  const collecte = data.transactions.filter(t=>t.type==='recette'&&t.category==='deplacement_participation'&&exerciceForDate(t.date)===ui.year).reduce((s,t)=>s+t.amount,0);

  document.getElementById('app').innerHTML = `

      <button class="btn ghost" style="margin:0;width:auto;" onclick="ui.deplacementsView='liste';renderAll()">← Retour à la liste</button>

    </div>

    <div class="card">
      <table class="report">
        ${natures.map(([n,label])=>`<tr><td>${escapeHtml(label)}</td><td class="v">${euro(totals[n])}</td></tr>`).join('')}
        <tr class="total"><td>Total coûts réels</td><td class="v">${euro(totalGeneral)}</td></tr>
        <tr><td>Prise en charge club</td><td class="v">${euro(priseCharge)}</td></tr>
        <tr><td>Collecté auprès des participants</td><td class="v">${euro(collecte)}</td></tr>

      <div class="note">Le détail par nature (péage, essence...) est indépendant des comptes comptables : il permet un suivi fin sans multiplier les comptes.</div>
    </div>
  `;
}

  const nom = document.getElementById('tf-nom').value.trim();

  if(!date){ showToast('Indiquez une date'); return; }

/* ============== EVENEMENTS : CALCUL ============== */
function eventCalc(ev){
  const txs = data.transactions.filter(t=>t.eventId===ev.id);
  const totalDepenses = txs.filter(t=>t.type==='depense').reduce((s,t)=>s+t.amount,0);
  const totalRecettes = txs.filter(t=>t.type==='recette').reduce((s,t)=>s+t.amount,0);
  const enAttente = txs.filter(t=>!isReglee_(t));
  return { totalDepenses, totalRecettes, solde: totalRecettes-totalDepenses, enAttenteCount: enAttente.length, enAttenteMontant: enAttente.reduce((s,t)=>s+t.amount,0) };
}

async function submitEventForm(){
  const nom = document.getElementById('ev-nom').value.trim();
  const date = document.getElementById('ev-date').value;
  if(!nom){ showToast('Indiquez un nom'); return; }
  if(!date){ showToast('Indiquez une date'); return; }
  if(ui.editEventId){
    const e = data.events.find(e=>e.id===ui.editEventId);
    e.nom=nom; e.date=date;
  } else {
    const e = { id: uid('evt'), nom, date };
    data.events.push(e);
    ui.selectedEventId = e.id;
  }
  await saveData();
  closeForm();
  showToast('Événement enregistré ✓');
  renderAll();
}
async function deleteEvent(id){
  data.transactions = data.transactions.filter(t=>t.eventId!==id);
  data.events = data.events.filter(e=>e.id!==id);
  await saveData();
  closeForm();
  ui.selectedEventId = null;
  showToast('Événement supprimé');
  renderAll();
}

/* Mini compte de résultat d'un événement : solde par paire produit/charge (701-601, 706-606,
   707-607 — comptes "miroir" du plan comptable de ce club pour chaque activité), plus une ligne
   "Autres" pour le reste. Les comptes de tiers (classe 4) et les immobilisations sont exclus,
   comme pour le compte de résultat général. */
function eventMiniResultat_(ev){
  const txs = data.transactions.filter(t=>t.eventId===ev.id);
  const pairs = [
    { key:'701|601', titre:'Produits finis / Matières premières (701 – 601)' },
    { key:'706|606', titre:'Prestations de services / Achats non stockés (706 – 606)' },
    { key:'707|607', titre:'Marchandises (707 – 607)' },
  ];
  const used = new Set();
  const rows = pairs.map(p=>{
    const [pRec,pDep] = p.key.split('|');
    const recTx = txs.filter(t=>t.type==='recette' && accountForTx(t).startsWith(pRec));
    const depTx = txs.filter(t=>t.type==='depense' && !t.immo && accountForTx(t).startsWith(pDep));
    recTx.forEach(t=>used.add(t.id)); depTx.forEach(t=>used.add(t.id));
    const rec = recTx.reduce((s,t)=>s+t.amount,0);
    const dep = depTx.reduce((s,t)=>s+t.amount,0);
    return { titre:p.titre, rec, dep, solde: rec-dep };
  });
  const autresTx = txs.filter(t=>!used.has(t.id) && !t.immo && !/^4/.test(accountForTx(t)));
  const autresRec = autresTx.filter(t=>t.type==='recette').reduce((s,t)=>s+t.amount,0);
  const autresDep = autresTx.filter(t=>t.type==='depense').reduce((s,t)=>s+t.amount,0);
  rows.push({ titre:'Autres produits et charges', rec:autresRec, dep:autresDep, solde:autresRec-autresDep });
  const totalRec = rows.reduce((s,r)=>s+r.rec,0);
  const totalDep = rows.reduce((s,r)=>s+r.dep,0);
  return { rows, totalRec, totalDep, totalSolde: totalRec-totalDep };
}

/* ============== RAPPROCHEMENT BANCAIRE (relevés) ============== */
function parseReleveText_(text){
  const lines = text.split(/\r?\n/);
  const dateRe = /^[^0-9A-Za-zÀ-ÿ]{0,3}(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/;
  const amountRe = /-?\d{1,3}(?:[ .]\d{3})*[.,]\d{2}/g;
  const toNum = s => parseFloat(String(s).replace(/^-/,'').replace(/[ .](?=\d{3}\b)/g,'').replace(',', '.')) * (/^-/.test(s)?-1:1);
  const parsed = [];
  for(let raw of lines){
    // tolère 0 à 3 caractères parasites (puce, trait de bordure de tableau...) avant la date,
    // fréquents sur une photo de relevé papier mal linéarisée par l'OCR
    const line = raw.trim();
    if(!line) continue;
    const dm = line.match(dateRe);
    if(!dm) continue;
    let [, d, mo, y] = dm;
    if(y.length===2) y = (parseInt(y)<70?'20':'19')+y;
    d=d.padStart(2,'0'); mo=mo.padStart(2,'0');
    if(!(parseInt(mo)>=1 && parseInt(mo)<=12 && parseInt(d)>=1 && parseInt(d)<=31)) continue;
    const dateIso = `${y}-${mo}-${d}`;
    const rest = line.slice(dm[0].length);
    const nums = rest.match(amountRe);
    if(!nums || nums.length===0) continue;
    const amtStr = nums.length>=2 ? nums[nums.length-2] : nums[nums.length-1];
    const val = Math.abs(toNum(amtStr));
    if(isNaN(val) || val<=0 || val>999999) continue;
    // la colonne "Solde" (quand elle est lue) donne le dernier nombre de la ligne
    const solde = nums.length>=2 ? toNum(nums[nums.length-1]) : null;
    const wordNeg = /^-/.test(amtStr) || /\bdebit\b|\bdébit\b/i.test(rest);
    const wordPos = /\bcredit\b|\bcrédit\b/i.test(rest);
    const label = rest.replace(amountRe,'').replace(/\s+/g,' ').trim().slice(0,90) || 'Opération';
    parsed.push({ date: dateIso, label, val, solde, wordNeg, wordPos });
  }
  // Le scan ne sait pas si un montant vient de la colonne Débit (gauche) ou Crédit (droite) :
  // l'OCR aplatit tout en texte, et le mot "débit"/"crédit" n'apparaît presque jamais sur chaque
  // ligne (juste dans l'en-tête). On déduit donc le sens de l'évolution du solde d'une ligne à
  // l'autre (solde qui baisse = dépense, solde qui monte = recette), bien plus fiable.
  // Sans solde exploitable, on retombe sur la présence du mot débit/crédit (sinon recette par défaut) —
  // à vérifier et corriger ligne par ligne avec "✏️ Modifier" si besoin.
  const out = [];
  let prevSolde = null;
  for(const p of parsed){
    let negative;
    if(prevSolde!=null && p.solde!=null && Math.abs(Math.abs(p.solde-prevSolde)-p.val)<=0.02){
      negative = (p.solde - prevSolde) < 0;
    }else{
      negative = p.wordNeg && !p.wordPos;
    }
    if(p.solde!=null) prevSolde = p.solde;
    out.push({ date: p.date, label: p.label, amount: negative ? -p.val : p.val });
  }
  return out;
}
/* Beaucoup de relevés n'ont que deux colonnes Débit/Crédit, sans colonne Solde : dans ce cas,
   le seul moyen de connaître le sens d'un montant est sa position horizontale sur la page
   (colonne de gauche = Débit = dépense, colonne de droite = Crédit = recette). Cette version
   utilise les coordonnées des mots reconnus par l'OCR quand elles sont disponibles ; sinon elle
   se rabat sur l'analyse texte classique (solde, ou mot "débit"/"crédit" écrit en toutes lettres).
   Elle recolle aussi les lignes de libellé qui continuent sur la ligne suivante sans date. */
function parseReleveLines_(pages){
  if(!pages.some(p=>p.lines)) return parseReleveText_(pages.map(p=>p.text).join('\n'));
  const dateRe = /^[^0-9A-Za-zÀ-ÿ]{0,3}(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/;
  const dateAnyRe = /\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/g;
  const amountRe = /-?\d{1,3}(?:[ .]\d{3})*[.,]\d{2}/g;
  const amountTokenRe = /^-?\d{1,3}(?:[ .]\d{3})*[.,]\d{2}$/;
  const toNum = s => parseFloat(String(s).replace(/^-/,'').replace(/[ .](?=\d{3}\b)/g,'').replace(',', '.')) * (/^-/.test(s)?-1:1);
  const rows = [];
  for(const page of pages){
    const lines = page.lines;
    const rawLines = lines ? lines.map(l=>l.text) : page.text.split(/\r?\n/);
    let prevRow = null;
    for(let li=0; li<rawLines.length; li++){
      const line = (rawLines[li]||'').trim();
      if(!line) continue;
      const dm = line.match(dateRe);
      if(!dm){
        if(prevRow && !amountRe.test(line) && line.length<=60){
          const extra = line.replace(dateAnyRe,'').replace(/\s+/g,' ').trim();
          if(extra) prevRow.label = (prevRow.label+' '+extra).trim().slice(0,90);
        }
        continue;
      }
      const rest = line.slice(dm[0].length);
      const nums = rest.match(amountRe);
      if(!nums || nums.length===0){ prevRow = null; continue; }
      const amtStr = nums.length>=2 ? nums[nums.length-2] : nums[nums.length-1];
      const val = Math.abs(toNum(amtStr));
      if(isNaN(val) || val<=0 || val>999999){ prevRow = null; continue; }
      const solde = nums.length>=2 ? toNum(nums[nums.length-1]) : null;
      const wordNeg = /^-/.test(amtStr) || /\bdebit\b|\bdébit\b/i.test(rest);
      const wordPos = /\bcredit\b|\bcrédit\b/i.test(rest);
      const label = rest.replace(dateAnyRe,'').replace(amountRe,'').replace(/\s+/g,' ').trim().slice(0,90) || 'Opération';
      let x = null;
      if(lines){
        const words = lines[li].words || [];
        for(const w of words){
          const t = (w.text||'').trim().replace(/[^0-9,.\-]+$/,'');
          if(w.x0==null || !amountTokenRe.test(t)) continue;
          if(Math.abs(Math.abs(toNum(t))-val) < 0.005){ x = (w.x0+(w.x1!=null?w.x1:w.x0))/2; break; }
        }
      }
      let [, d, mo, y] = dm;
      if(y.length===2) y = (parseInt(y)<70?'20':'19')+y;
      d=d.padStart(2,'0'); mo=mo.padStart(2,'0');
      const row = { date:`${y}-${mo}-${d}`, label, val, solde, x, wordNeg, wordPos };
      rows.push(row);
      prevRow = row;
    }
  }
  const xs = rows.filter(r=>r.x!=null).map(r=>r.x).sort((a,b)=>a-b);
  let xThreshold = null;
  if(xs.length>=2){
    let bestGap=-1, bestIdx=-1;
    for(let i=1;i<xs.length;i++){ const gap = xs[i]-xs[i-1]; if(gap>bestGap){ bestGap=gap; bestIdx=i; } }
    const span = xs[xs.length-1]-xs[0];
    if(bestIdx>0 && span>0 && bestGap > span*0.12) xThreshold = (xs[bestIdx-1]+xs[bestIdx])/2;
  }
  const out = [];
  let prevSolde = null;
  for(const r of rows){
    let negative;
    if(prevSolde!=null && r.solde!=null && Math.abs(Math.abs(r.solde-prevSolde)-r.val)<=0.02){
      negative = (r.solde - prevSolde) < 0;
    }else if(xThreshold!=null && r.x!=null){
      negative = r.x < xThreshold; // colonne de gauche = Débit = dépense
    }else{
      negative = r.wordNeg && !r.wordPos;
    }
    if(r.solde!=null) prevSolde = r.solde;
    out.push({ date: r.date, label: r.label, amount: negative ? -r.val : r.val });
  }
  return out;
}
/* ---- aides communes : OCR + devinette de catégorie ---- */
async function ocrFileText_(file, maxPages, onProgress){
  const images = await fileToOcrImages(file, maxPages);
  let text = '';
  for(let i=0;i<images.length;i++){
    if(onProgress) onProgress(images.length>1 ? `page ${i+1}/${images.length}` : '');
    const res = await Tesseract.recognize(images[i], 'fra');
    text += '\n' + ((res && res.data && res.data.text) || '');
  }
  return text;
}
/* Variante qui conserve, quand c'est possible, la position (x) de chaque mot reconnu :
   c'est ce qui permet, pour un relevé bancaire, de savoir si un montant est dans la colonne
   Débit (gauche) ou Crédit (droite) même quand le relevé n'a pas de colonne Solde. */
async function ocrFileLines_(file, maxPages, onProgress){
  const images = await fileToOcrImages(file, maxPages);
  const pages = [];
  for(let i=0;i<images.length;i++){
    if(onProgress) onProgress(images.length>1 ? `page ${i+1}/${images.length}` : '');
    const res = await Tesseract.recognize(images[i], 'fra');
    const data = (res && res.data) || {};
    let lines = null;
    if(Array.isArray(data.lines) && data.lines.length){
      lines = data.lines.map(ln=>({
        text: ln.text || '',
        words: Array.isArray(ln.words) ? ln.words.map(w=>({
          text: w.text || '',
          x0: (w.bbox && typeof w.bbox.x0==='number') ? w.bbox.x0 : null,
          x1: (w.bbox && typeof w.bbox.x1==='number') ? w.bbox.x1 : null
        })) : []
      }));
    }
    pages.push({ text: data.text || '', lines });
  }
  return pages;
}

function guessCategory_(text, wantType){
  const t = text || '';
  for(const [key,type,re] of CATEGORY_RULES_){

    if(CATEGORIES[key] && re.test(t)) return key;

}

const getReleve_ = id => (data.releves||[]).find(r=>r.id===id);
function moisLabel_(m){
  if(!m) return 'Mois non indiqué';
  const [y,mo] = m.split('-');
  const s = new Date(+y, +mo-1, 1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function defaultReleveMois_(){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function candidatesForLine_(l){
  // Recherche sur TOUTES les écritures non rapprochées, sans limite de date : le tri par
  // proximité de date sert juste à présenter les plus probables en premier.
  const wantType = l.amount>=0 ? 'recette' : 'depense';
  const target = new Date(l.date+'T00:00:00');
  const dist = t => Math.abs((new Date(t.date+'T00:00:00')-target)/86400000);
  return data.transactions.filter(t=>{
    if(t.type!==wantType || t.pointe || t.amount<=0) return false;
    if(!['5121','5122'].includes(t.tresoCompte||'5121')) return false;
    return true;
  }).sort((a,b)=>dist(a)-dist(b));
}
function findMatchesForLine_(l){
  const amt = Math.abs(l.amount);
  return candidatesForLine_(l).filter(t=>Math.abs(t.amount-amt)<=0.01);
}
function applyReleveText_(r, text){
  r.lines = parseReleveText_(text).map(l=>({ date:l.date, label:l.label, amount:l.amount, txIds:[], confirmed:false }));
}
function applyReleveLines_(r, pages){
  r.lines = parseReleveLines_(pages).map(l=>({ date:l.date, label:l.label, amount:l.amount, txIds:[], confirmed:false }));
}
async function handleReleveUpload(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const mois = (document.getElementById('releve-mois')||{}).value || ui.releveMois || '';
  if(!mois){ showToast('Indiquez d\'abord le mois du relevé'); return; }
  ui.releveMois = mois;
  if(typeof Tesseract === 'undefined'){ showToast("La lecture automatique n'a pas pu se charger"); return; }
  ui.releveScan = { progress:'' };
  renderAll();
  try{
    const pages = await ocrFileLines_(file, 15, p=>{ ui.releveScan.progress = p; renderAll(); });
    const rel = { id: uid('rel'), fileId:null, name:file.name, date:todayStr(), mois, lines:[] };
    applyReleveLines_(rel, pages);
    try{
      const folderId = await findOrCreateDriveSubfolder('Relevés bancaires');
      const uploaded = await driveUploadFile(file, folderId, `${mois}_${file.name}`);
      rel.fileId = uploaded.id; rel.name = uploaded.name;
    }catch(upErr){ console.error('Erreur upload relevé', upErr); }
    data.releves.push(rel);
    await saveData();
    ui.releveOpenId = rel.id;
    if(!rel.lines.length) showToast("Aucune ligne lue automatiquement — ouvrez le PDF et créez les écritures à la main");
  }catch(e){
    console.error('Erreur OCR relevé', e);
    showToast('Erreur pendant la lecture du relevé — réessayez');
  }
  ui.releveScan = null;
  renderAll();
  window.scrollTo(0,0);
}
async function analyseReleve(relId){
  const r = getReleve_(relId); if(!r) return;
  const fid = releveFileId_(r);
  if(!fid){ showToast('Fichier introuvable sur Drive'); return; }
  if(typeof Tesseract === 'undefined'){ showToast("La lecture automatique n'a pas pu se charger"); return; }
  ui.releveScan = { progress:'' }; renderAll();
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`);
    const blob = await res.blob();
    const type = blob.type || (/\.pdf$/i.test(r.name) ? 'application/pdf' : 'image/jpeg');
    const pages = await ocrFileLines_(new Blob([blob],{type}), 15, p=>{ ui.releveScan.progress = p; renderAll(); });
    applyReleveLines_(r, pages);
    await saveData();
    if(!r.lines.length) showToast("Aucune ligne n'a pu être lue automatiquement");

async function deleteReleve(relId){
  const r = getReleve_(relId); if(!r) return;
  (r.lines||[]).forEach(l=>(l.txIds||[]).forEach(id=>{ const t=data.transactions.find(x=>x.id===id); if(t){ t.pointe=false; delete t.dateLettrage; delete t.releveId; } }));
  data.releves = data.releves.filter(x=>x.id!==relId);
  ui.releveOpenId = null; ui.releveSel = null;

async function confirmReleveLine(relId, idx, ids){
  const r = getReleve_(relId), l = r && r.lines[idx];
  if(!l || !ids.length) return;
  const finalIds = [];
  ids.forEach(id=>{
    const t = data.transactions.find(x=>x.id===id);
    if(!t) return;
    let target = t;
    if(t.tiersType && !isReglee_(t)){
      // Cette ligne de relevé correspond au règlement d'une dette tiers encore ouverte : on la
      // marque réglée à la date de la ligne bancaire (contrepassation), et c'est cette nouvelle
      // écriture — la vraie écriture de trésorerie — qui est rapprochée, pas la dette d'origine.
      const ctx = creerContrepassation_(t, l.date);
      if(ctx) target = ctx;
    }
    target.pointe = true; target.dateLettrage = l.date; target.releveId = relId;
    finalIds.push(target.id);
  });
  l.confirmed = true; l.txIds = finalIds; ui.releveSel = null;
  await saveData();
  showToast('Ligne rapprochée ✓');
  renderAll();
}
async function undoReleveLine(relId, idx){

}

async function saveEditReleveLine(){
  const e = ui.releveEdit; if(!e) return;
  const r = getReleve_(e.relId); if(!r) return;
  if(!e.date){ showToast('Indiquez une date'); return; }
  const amt = parseFloat(String(e.amount).replace(',','.'));
  if(isNaN(amt) || amt<=0){ showToast('Indiquez un montant valide'); return; }
  const label = (e.label||'').trim() || 'Opération';
  const signedAmount = e.dc==='debit' ? -amt : amt;
  if(!r.lines) r.lines = [];
  if(e.idx==null){
    r.lines.push({ date:e.date, label, amount: signedAmount, txIds:[], confirmed:false });
  }else{
    const l = r.lines[e.idx]; if(!l) return;

  await saveData(); showToast('Ligne enregistrée'); renderAll();

    const sum = sel.ids.reduce((acc,id)=>{ const t=data.transactions.find(x=>x.id===id); return acc+(t?t.amount:0); },0);

/* ---- import Excel : ajoute des opérations au journal (format de l'export Excel : Date, Type, N° compte, Montant, Commentaire…) ---- */
function normKey_(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function excelDateToIso_(v){
  if(v instanceof Date && !isNaN(v)){ const d = new Date(v.getTime()+12*3600*1000); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
  if(typeof v==='number' && typeof XLSX!=='undefined' && XLSX.SSF){ const p = XLSX.SSF.parse_date_code(v); if(p) return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0'); }
  const s = String(v||'').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m){ let y=m[3]; if(y.length===2) y=(parseInt(y)<70?'20':'19')+y; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
  return null;
}
function handleImportExcel(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  if(typeof XLSX === 'undefined'){ showToast('Bibliothèque Excel indisponible (pas de connexion)'); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const wb = XLSX.read(ev.target.result, { type:'array', cellDates:true });
      if(wb.SheetNames.includes('_Sauvegarde')){
        /* fichier exporté par l'app : même procédé que le JSON (remplacement complet après confirmation) */
        const rowsS = XLSX.utils.sheet_to_json(wb.Sheets['_Sauvegarde'], { header:1, defval:'' });
        const imported = JSON.parse(rowsS.slice(1).map(r=>String(r[0]||'')).join(''));
        if(!imported || typeof imported!=='object' || !Array.isArray(imported.transactions)){ showToast('Fichier Excel invalide'); return; }
        ['players','trips','events','teams','releves'].forEach(k=>{ if(!imported[k]) imported[k] = []; });
        if(!imported.settings) imported.settings = { clubName:'Mon club', soldeInitial:0, immoInitial:0 };
        ui.pendingImport = imported;
        renderAll();
        return;
      }
      const sheetName = wb.SheetNames.find(n=>normKey_(n)==='journal') || wb.SheetNames[0];
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval:'' });
      const rows = [];
      let dupes = 0, bad = 0;
      raw.forEach(r=>{
        const k = {};
        Object.keys(r).forEach(h=>{ k[normKey_(h)] = r[h]; });
        const find = (...tests)=>{ const key = Object.keys(k).find(h=>tests.some(t=>t instanceof RegExp ? t.test(h) : h===t)); return key===undefined ? '' : k[key]; };
        const date = excelDateToIso_(find('date'));
        let amount = find(/montant/);
        if(typeof amount==='string') amount = parseFloat(amount.replace(/\s/g,'').replace(',','.'));
        if(!date || typeof amount!=='number' || isNaN(amount) || amount===0){ if(Object.values(r).some(x=>String(x).trim()!=='')) bad++; return; }
        const typeTxt = normKey_(find('type'));
        let type;
        if(/recette|produit|encaiss|credit/.test(typeTxt)) type='recette';
        else if(/depense|charge|debit/.test(typeTxt)) type='depense';
        else type = amount<0 ? 'depense' : 'recette';
        amount = Math.round(Math.abs(amount)*100)/100;
        const comment = String(find(/commentaire|description|objet/)||'').trim();
        const compte = String(find(/^n.?\s?compte/, 'numero compte', 'compte n')||'').trim();
        let category = Object.keys(CATEGORIES).find(c=>CATEGORIES[c].type===type && !CATEGORIES[c].hidden && compte && compteFor(c)===compte);
        let compteOverride;
        if(!category){
          category = guessCategory_(comment, type);
          if(compte && (data.accounts||[]).some(a=>a.compte===compte)) compteOverride = compte;
        }
        const immo = /^(oui|1|true|x)$/.test(normKey_(find(/invest/)));
        const isDup = data.transactions.some(t=>t.date===date && t.type===type && Math.abs(t.amount-amount)<0.005 && (t.comment||'')===comment) || rows.some(x=>x.date===date && x.type===type && x.amount===amount && x.comment===comment && x.compte===compte && false);
        if(isDup){ dupes++; return; }
        const row = { type, category, amount, date, comment, compte };
        if(compteOverride) row.compteOverride = compteOverride;
        if(immo && CATEGORIES[category] && CATEGORIES[category].allowImmo) row.immo = true;
        rows.push(row);
      });
      if(!rows.length){ showToast(dupes ? 'Toutes les opérations existent déjà' : 'Aucune opération lisible (colonnes attendues : Date, Type, Montant…)'); return; }
      ui.pendingExcel = { rows, dupes, bad, nRec: rows.filter(x=>x.type==='recette').length, nDep: rows.filter(x=>x.type==='depense').length };
      renderAll();
    }catch(err){ console.error(err); showToast('Fichier Excel illisible'); }
  };
  reader.readAsArrayBuffer(file);
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){ showToast("Bibliothèque Excel indisponible (pas de connexion)"); return; }
  const wb = XLSX.utils.book_new();

  const journalRows = [...data.transactions].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{
